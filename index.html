def('trim',{name:'TRIM',icon:'🍰',c:'#E0487F',
  rule:'Drag one straight cut to slice off exactly the asked-for share.',
  make(){
    const need=3;
    let round=0,tries=3,target=.5,lay=null,a=null,b2=null,frac=-1,good=false,res=[];
    function geom(){
      const b=playBand();
      const w=Math.min(W*.82,360),h=Math.min(b.h*.3,214);
      const y=b.y+Math.max(18,(b.h-(h+96))/2);
      lay={x:W/2-w/2,y,w,h,cx:W/2,cy:y+h/2,cardY:y+h+26};
    }
    const CUTS=[.25,.5,.34,.75,.6];
    function fresh(){
      target=CUTS[Math.floor(Math.random()*CUTS.length)];
      a=null;b2=null;frac=-1;good=false;res=[];
    }
    geom();fresh();
    function rect(){const l=lay;return [[l.x,l.y],[l.x+l.w,l.y],[l.x+l.w,l.y+l.h],[l.x,l.y+l.h]];}
    function clip(poly,p,q){
      const f=v=>((q[0]-p[0])*(v[1]-p[1])-(q[1]-p[1])*(v[0]-p[0]));
      const out=[];
      for(let i=0;i<poly.length;i++){
        const P=poly[i],Q=poly[(i+1)%poly.length],fp=f(P),fq=f(Q);
        if(fp>=0)out.push(P);
        if((fp>=0)!==(fq>=0)){const t=fp/(fp-fq);out.push([P[0]+(Q[0]-P[0])*t,P[1]+(Q[1]-P[1])*t]);}
      }
      return out;
    }
    function area(poly){
      let s=0;
      for(let i=0;i<poly.length;i++){const P=poly[i],Q=poly[(i+1)%poly.length];s+=P[0]*Q[1]-Q[0]*P[1];}
      return Math.abs(s)/2;
    }
    function cut(){
      const R=rect();
      res=clip(R,a,b2);
      const full=area(R);
      frac=full?area(res)/full:0;
      good=Math.abs(frac-target)<=.05;
      if(good){
        round++;chime();burst(lay.cx,lay.cy,'#43D67C',24);
        if(round>=need){win(tries===3?3:tries===2?2:1);return;}
        tries=3;setTimeout(()=>{if(!finished)fresh();},700);
      }else{
        tries--;buzz();shake=.8;
        if(tries<=0){fail('The cake is ruined');return;}
      }
    }
    function pct(v){return Math.round(v*100)+'%';}
    return {
      gk:'trim',onResize:geom,
      update(){},
      draw(){
        const R=rect();
        g.fillStyle='#DCE8F7';
        g.beginPath();g.ellipse(lay.cx,lay.y+lay.h+6,lay.w*.6,15,0,0,7);g.fill();
        candyRect(lay.x,lay.y,lay.w,lay.h,16,'#F2B77F');
        const fh=lay.h*.3,e=Math.max(4,lay.h*.11);
        candyRect(lay.x,lay.y,lay.w,fh,16,'#FFF1D6');
        g.fillStyle='#FFF1D6';
        g.fillRect(lay.x+3,lay.y+fh-4,lay.w-6,e+4);
        for(let i=0;i<7;i++){
          const x=lay.x+lay.w*(i+.5)/7;
          g.beginPath();g.arc(x,lay.y+fh+e,lay.w*.055,0,Math.PI);g.fill();
        }
        g.fillStyle='#E0487F';
        for(let i=0;i<6;i++){
          const x=lay.x+lay.w*(i+.5)/6;
          g.beginPath();g.arc(x,lay.y+fh*.42,7,0,7);g.fill();
        }
        if(good&&res.length){
          g.fillStyle='rgba(67,214,124,.4)';g.beginPath();
          res.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath();g.fill();
        }
        if(a&&b2){
          g.strokeStyle='#22304F';g.lineWidth=4;g.setLineDash([10,8]);
          const dx=b2[0]-a[0],dy=b2[1]-a[1],L=Math.hypot(dx,dy)||1,k=(W+H)/L;
          g.beginPath();g.moveTo(a[0]-dx*k,a[1]-dy*k);g.lineTo(b2[0]+dx*k,b2[1]+dy*k);g.stroke();
          g.setLineDash([]);
        }
        candyRect(W/2-96,lay.cardY,192,60,16,'#fff');
        lbl('cut off '+pct(target),W/2,lay.cardY+22,18,'#22304F');
        lbl(frac>=0?pct(frac)+' this cut':'drag a straight line',W/2,lay.cardY+44,12,'#61739A');
      },
      hold(x,y,down){
        if(finished||round>=need||good)return;
        if(down){a=[x,y];b2=[x,y];frac=-1;}
      },
      move(x,y){
        if(!a)return;
        b2=[x,y];
        const R=rect();
        res=clip(R,a,b2);
        frac=area(R)?area(res)/area(R):0;
      },
      release(){if(a&&b2&&Math.hypot(b2[0]-a[0],b2[1]-a[1])>24)cut();a=null;b2=null;},
      hud(){return 'slice '+Math.min(round+1,need)+'/'+need+'   tries left '+tries;},
      dbg(){return {target,round,need,tries,frac:+(frac||0).toFixed(3)};},
      summary(){return 'sliced <b>'+need+'</b> shares to the millimetre';}
    };
  }});

/* ================= 58 ROUTE ================= */
def('route',{name:'ROUTE',icon:'📮',c:'#43D67C',
  rule:'Walk one unbroken path and call at every house. Never cross your own trail.',
  make(){
    const dim=5;
    let path=[],houses=[],trail=[],round=0,hp=3;
    function ham(){
      const seen=new Uint8Array(dim*dim);
      const out=[];
      function dfs(i){
        seen[i]=1;out.push(i);
        if(out.length===dim*dim)return true;
        const r=Math.floor(i/dim),c=i%dim;
        for(const d of shuf([[-1,0],[1,0],[0,-1],[0,1]])){
          const nr=r+d[0],nc=c+d[1];
          if(nr<0||nc<0||nr>=dim||nc>=dim||seen[nr*dim+nc])continue;
          if(dfs(nr*dim+nc))return true;
        }
        seen[i]=0;out.pop();return false;
      }
      return dfs(Math.floor(Math.random()*dim*dim))?out:null;
    }
    function fresh(){
      for(let k=0;k<200;k++){
        const p=ham();
        if(p){path=p;break;}
      }
      if(!path.length)path=[0,1,2,3,4,9,14,19,24,23,22,21,20,15,10,5,6,7,8,13,18,17,16,11,12];
      houses=[path[0]];
      for(let i=1;i<path.length-1&&houses.length<5;i++)
        if(Math.random()<.28)houses.push(path[i]);
      if(houses.length<5)houses.push(path[path.length-1]);
      trail=[path[0]];round=0;
    }
    fresh();
    function adj(a,b){
      const r1=Math.floor(a/dim),c1=a%dim,r2=Math.floor(b/dim),c2=b%dim;
      return Math.abs(r1-r2)+Math.abs(c1-c2)===1;
    }
    function done(){
      return houses.every(h=>trail.indexOf(h)>=0);
    }
    return {
      gk:'route',
      update(){},
      draw(){
        const b=playBand(),G=cellGeom(dim,dim,.9,420);
        for(let i=0;i<dim*dim;i++){
          const p=cellAt(G,i);
          candyRect(p.x,p.y,G.cw,G.ch,11,'#EDF3FC');
        }
        g.strokeStyle='#43D67C';g.lineWidth=Math.max(8,G.cw*.16);g.lineCap='round';g.lineJoin='round';
        g.beginPath();
        trail.forEach((i,n)=>{const q=cellMid(G,i);n?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y);});
        g.stroke();
        for(const h of houses){
          const q=cellMid(G,h),seen=trail.indexOf(h)>=0;
          candyRect(q.x-G.cw*.26,q.y-G.cw*.24,G.cw*.52,G.cw*.44,6,seen?'#43D67C':'#FFC531');
          g.fillStyle=seen?'#1F7A43':'#C97F00';
          g.beginPath();g.moveTo(q.x-G.cw*.3,q.y-G.cw*.22);
          g.lineTo(q.x,q.y-G.cw*.44);g.lineTo(q.x+G.cw*.3,q.y-G.cw*.22);g.closePath();g.fill();
        }
        const t=cellMid(G,trail[trail.length-1]);
        drawFace(t.x,t.y,G.cw*.3,'#FFE07A','#FFB020','idle',false);
        void b;
      },
      tap(x,y){
        if(finished)return;
        const G=cellGeom(dim,dim,.9,420);
        const i=findCell(G,x,y,dim*dim);
        if(i<0)return;
        const last=trail[trail.length-1];
        if(i===last){
          if(trail.length>1){trail.pop();blip(360);}
          return;
        }
        if(!adj(last,i)){buzz();shake=.3;return;}
        if(trail.indexOf(i)>=0){buzz();shake=.5;toast('your own trail');return;}
        trail.push(i);ding(1);
        const p=cellMid(G,i);burst(p.x,p.y,'#43D67C',8);
        if(done()){
          chime();
          win(trail.length<=12?3:trail.length<=18?2:1);
        }
      },
      hud(){return 'houses '+trail.filter(h=>houses.indexOf(h)>=0).length+'/'+houses.length;},
      dbg(){return {houses:houses.slice(),trail:trail.slice(),path:path.slice()};},
      summary(){return 'called at <b>'+houses.length+'</b> houses in '+trail.length+' steps';}
    };
  }});

/* ================= 59 TANDEM ================= */
def('tandem',{name:'TANDEM',icon:'🧷',c:'#22D3C5',
  rule:'One D-pad moves both twins at once. Park each on their own coloured pad.',
  make(){
    const dim=5;
    let walls=[],p1=0,p2=0,g1=0,g2=0,round=0,mv=0,par=0,need=2;
    const idx=(r,c)=>r*dim+c;
    const free=i=>i>=0&&i<dim*dim&&walls.indexOf(i)<0;
    function solve(){
      const key=(a,b)=>a*dim*dim+b,seen=new Uint8Array(dim*dim*dim*dim);
      const st=[[p1,p2,0]];let h=0;
      const D=[[-1,0],[1,0],[0,-1],[0,1]];
      seen[key(p1,p2)]=1;
      while(h<st.length){
        const s=st[h++];
        for(const d of D){
          const a=[Math.floor(s[0]/dim)+d[0],s[0]%dim+d[1]];
          const b=[Math.floor(s[1]/dim)+d[0],s[1]%dim+d[1]];
          if(a[0]<0||a[1]<0||a[0]>=dim||a[1]>=dim||b[0]<0||b[1]<0||b[0]>=dim||b[1]>=dim)continue;
          const na=idx(a[0],a[1]),nb=idx(b[0],b[1]);
          if(!free(na)||!free(nb))continue;
          if(na===s[1]&&nb===s[0])continue;
          if(na===nb)continue;
          const k=key(na,nb);
          if(seen[k])continue;
          seen[k]=1;
          if(na===g1&&nb===g2)return s[2]+1;
          st.push([na,nb,s[2]+1]);
        }
      }
      return -1;
    }
    function fresh(){
      let ok2=false;
      for(let k=0;k<400&&!ok2;k++){
        walls=[];
        const nw=4+round;
        while(walls.length<nw){
          const i=Math.floor(Math.random()*dim*dim);
          if(walls.indexOf(i)<0)walls.push(i);
        }
        const fl=[];for(let i=0;i<dim*dim;i++)if(free(i))fl.push(i);
        if(fl.length<10)continue;
        const s=shuf(fl.slice());
        p1=s[0];p2=s[1];g1=s[2];g2=s[3];
        if(g1===p2||g2===p1)continue;
        const d=solve();
        if(d>=7&&d<=16){par=d;ok2=true;}
      }
      if(!ok2){walls=[6,7,13];p1=0;p2=4;g1=24;g2=20;par=6;}
      mv=0;
    }
    fresh();
    function G(){
      const b=playBand(),s=Math.min(58,(W*.62)/3),gap=7;
      const avail=Math.max(120,b.h-(s*2+18));
      let cw=Math.floor(Math.min((Math.min(W*.86,380)-gap*(dim-1))/dim,(avail-gap*(dim-1))/dim));
      cw=Math.max(24,cw);
      const w=cw*dim+gap*(dim-1);
      return {cols:dim,rows:dim,gap,cw,ch:cw,w,h:w,x:(W-w)/2,
              y:b.y+Math.max(8,(b.h-(w+s*2+8))/2)};
    }
    function pad(){
      const g2=G(),s=Math.min(58,(W*.62)/3);
      return {s,x0:W/2-s*1.5,y0:g2.y+g2.h+10,g:g2};
    }
    function step(dr,dc){
      if(finished)return;
      const a=[Math.floor(p1/dim)+dr,p1%dim+dc],b=[Math.floor(p2/dim)+dr,p2%dim+dc];
      if(a[0]<0||a[1]<0||a[0]>=dim||a[1]>=dim||b[0]<0||b[1]<0||b[0]>=dim||b[1]>=dim)return;
      const na=idx(a[0],a[1]),nb=idx(b[0],b[1]);
      if(!free(na)||!free(nb))return;
      if(na===p2&&nb===p1)return;
      if(na===nb)return;
      p1=na;p2=nb;mv++;blip(520);
      if(p1===g1&&p2===g2){
        round++;chime();
        const Q=G();
        burst(cellMid(Q,p1).x,cellMid(Q,p1).y,'#22D3C5',20);
        if(round>=need){win(mv<=par?3:mv<=par*1.4?2:1);return;}
        fresh();
      }
    }
    const DP=[[-1,0,'↑'],[0,-1,'←'],[1,0,'↓'],[0,1,'→']];
    const SL=[[1,0],[0,1],[1,1],[2,1]];
    return {
      gk:'tandem',
      update(){},
      draw(){
        const P=pad(),G2=P.g;
        for(let i=0;i<dim*dim;i++){
          const p=cellAt(G2,i);
          if(walls.indexOf(i)>=0)candyRect(p.x,p.y,G2.cw,G2.ch,10,'#5B6C8E');
          else candyRect(p.x,p.y,G2.cw,G2.ch,10,i===g1?'#FFE3DC':i===g2?'#DCEBFF':'#F4FAFF');
        }
        for(const gp of [[g1,'#FF5D5D'],[g2,'#3FA9FF']]){
          const p=cellAt(G2,gp[0]);
          g.strokeStyle=gp[1];g.lineWidth=4;g.setLineDash([8,7]);
          rrect(p.x+5,p.y+5,G2.cw-10,G2.ch-10,8);g.stroke();g.setLineDash([]);
        }
        for(const pp of [[p1,'#FF5D5D'],[p2,'#3FA9FF']]){
          const q=cellMid(G2,pp[0]);
          candyCircle(q.x,q.y,G2.cw*.3,pp[1]);
          g.fillStyle='#fff';g.beginPath();g.arc(q.x-G2.cw*.09,q.y-G2.cw*.06,2.6,0,7);
          g.arc(q.x+G2.cw*.09,q.y-G2.cw*.06,2.6,0,7);g.fill();
        }
        for(let k=0;k<4;k++){
          const x=P.x0+SL[k][0]*P.s,y=P.y0+SL[k][1]*P.s;
          candyRect(x+3,y+3,P.s-6,P.s-6,13,'#EDF3FC');
          lbl(DP[k][2],x+P.s/2,y+P.s/2+1,21,'#22304F');
        }
      },
      tap(x,y){
        const P=pad();
        for(let k=0;k<4;k++){
          const px2=P.x0+SL[k][0]*P.s,py2=P.y0+SL[k][1]*P.s;
          if(x>=px2&&x<=px2+P.s&&y>=py2&&y<=py2+P.s){step(DP[k][0],DP[k][1]);return;}
        }
      },
      hud(){return 'pair '+(round+1)+'/'+need+'   '+mv+' moves (par '+par+')';},
      dbg(){return {p1,p2,g1,g2,round,need,mv,par};},
      summary(){return 'parked both twins in <b>'+mv+'</b> moves';}
    };
  }});

/* ================= 60 KNOT ================= */
def('knot',{name:'KNOT',icon:'🪢',c:'#A777FF',
  rule:'Drag the beads apart until no rope crosses another. That is the last lock.',
  make(){
    let N=9,P2=[],E=[],round=0,drag=-1;
    function lay(){const b=playBand();return {cx:W/2,cy:b.y+b.h*.47,R:Math.min(W*.44,b.h*.4,200)};}
    function xpts(){
      const out=[];
      for(let i=0;i<E.length;i++)for(let j=i+1;j<E.length;j++){
        const a=E[i],c=E[j];
        if(a[0]===c[0]||a[0]===c[1]||a[1]===c[0]||a[1]===c[1])continue;
        const p=segX(P2[a[0]],P2[a[1]],P2[c[0]],P2[c[1]]);
        if(p)out.push(p);
      }
      return out;
    }
    function crossings(){return xpts().length;}
    function segX(p,q,r,s){
      const ax=q[0]-p[0],ay=q[1]-p[1],bx=s[0]-r[0],by=s[1]-r[1];
      const dn=ax*by-ay*bx;
      if(Math.abs(dn)<1e-9)return null;
      const cx=r[0]-p[0],cy=r[1]-p[1];
      const t=(cx*by-cy*bx)/dn,u=(cx*ay-cy*ax)/dn;
      return t>.02&&t<.98&&u>.02&&u<.98?[p[0]+ax*t,p[1]+ay*t]:null;
    }
    function fresh(){
      N=8+round;
      const L=lay();
      E=[];
      for(let i=0;i<N;i++)E.push([i,(i+1)%N]);
      E.push([0,(N-2)%N]);E.push([0,(N+3)%N]);
      const slot=[];for(let i=0;i<N;i++)slot.push(i);
      let best=null,bx=0;
      for(let k=0;k<200;k++){
        const ord=shuf(slot.slice());
        P2=[];
        for(let i=0;i<N;i++){
          const a=Math.PI*2*ord[i]/N+(Math.random()-.5)*.2;
          const rr=L.R*(.8+Math.random()*.18);
          P2.push([L.cx+Math.cos(a)*rr,L.cy+Math.sin(a)*rr]);
        }
        const c=crossings();
        if(c>bx){bx=c;best=P2.map(p=>p.slice());}
        if(c>=4)break;
      }
      if(best)P2=best;
      drag=-1;
    }
    fresh();
    return {
      gk:'knot',
      update(){},
      draw(){
        const L=lay(),x=crossings();
        g.lineCap='round';
        for(const e of E){
          const p=P2[e[0]],q=P2[e[1]];
          g.strokeStyle=x?'#B9A6E8':'#7C4DD6';g.lineWidth=6;
          g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke();
          g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=2;
          g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke();
        }
        for(let i=0;i<N;i++){
          candyCircle(P2[i][0],P2[i][1],i===drag?20:17,i===drag?'#FFC531':'#A777FF');
          lbl(String(i+1),P2[i][0],P2[i][1]+1,13,'#fff');
        }
        g.strokeStyle='#DCE8F7';g.lineWidth=2;g.setLineDash([6,9]);
        g.beginPath();g.arc(L.cx,L.cy,L.R,0,7);g.stroke();g.setLineDash([]);
        for(const p of xpts()){
          g.fillStyle='#FF5D5D';g.beginPath();g.arc(p[0],p[1],8,0,7);g.fill();
          g.strokeStyle='#fff';g.lineWidth=2.6;g.beginPath();
          g.moveTo(p[0]-3.4,p[1]-3.4);g.lineTo(p[0]+3.4,p[1]+3.4);
          g.moveTo(p[0]+3.4,p[1]-3.4);g.lineTo(p[0]-3.4,p[1]+3.4);g.stroke();
        }
      },
      hold(x,y,down){
        if(down){
          drag=-1;
          for(let i=0;i<N;i++)if(Math.hypot(x-P2[i][0],y-P2[i][1])<28){drag=i;blip(420);break;}
        }else drag=-1;
      },
      move(x,y){
        if(drag<0)return;
        const L=lay();
        const d=Math.hypot(x-L.cx,y-L.cy);
        const k=d>L.R?L.R/d:1;
        P2[drag]=[L.cx+(x-L.cx)*k,L.cy+(y-L.cy)*k];
      },
      release(){
        if(drag>=0&&!crossings()){
          round++;chime();
          burst(P2[drag][0],P2[drag][1],'#A777FF',26);
          if(round>=3){win(3);return;}
          fresh();
        }
        drag=-1;
      },
      hud(){return 'knot '+(round+1)+'/3   '+crossings()+' crossings left';},
      dbg(){return {round,N,x:crossings()};},
      summary(){return 'untangled <b>3</b> knots — that is the whole box of tricks';}
    };
  }});

/* ================= engine ================= */
let cur=null,endTimer=0,lastOk=true,lastMsg='',introT=0;

function startLevel(lv){
  level=Math.max(1,Math.min(MAX,lv));
  clearTimeout(endTimer);
  parts=[];shake=0;flash=0;finished=false;
  const m=gameOf(level);
  cur=m.make();
  if(cur.onResize)cur.onResize();
  hudCache='';
  updateHud();
}
function win(st){
  if(finished)return;
  finished=true;lastOk=true;
  if(st==null)st=cur.stars?cur.stars():1;
  fanfare();confetti();flash=1;
  const k=level+'_s';
  if(!SAVE.best[k]||st>SAVE.best[k])SAVE.best[k]=st;
  SAVE.level=Math.max(SAVE.level,Math.min(MAX,level+1));save();
  clearTimeout(endTimer);endTimer=setTimeout(()=>showEnd(true,st),700);
}
function fail(msg){
  if(finished)return;
  finished=true;lastOk=false;lastMsg=msg||'Not this time';sad();
  clearTimeout(endTimer);endTimer=setTimeout(()=>showEnd(false,0),450);
}
function updateHud(){
  el('sLv').textContent=level;
  el('sName').textContent=(gameOf(level).name||'').slice(0,7);
  const t=gameOf(level).tools||{};
  el('bUndo').hidden=!t||!t.undo;
  el('bHint').hidden=!t||!t.hint;
  if(t&&t.undo)el('bUndo').disabled=!undoStack.length;
  hudEl.hidden=!cur||!cur.hud;
}
let hudCache='';
function tickHud(){
  if(!cur||view!=='game'||!cur.hud)return;
  const t=cur.hud();
  if(t!==hudCache){hudCache=t;el('hudTxt').textContent=t;}
}

/* ================= background & title deco ================= */
function paintBg(){
  const lg=g.createLinearGradient(0,0,0,H);
  lg.addColorStop(0,'#E3EEFF');lg.addColorStop(1,'#FBFDFF');
  g.fillStyle=lg;g.fillRect(0,0,W,H);
  const u=Math.min(W,H);
  soft(W*.12,H*.16,u*.36,'rgba(255,197,49,.26)');
  soft(W*.9,H*.1,u*.3,'rgba(63,169,255,.28)');
  soft(W*.86,H*.9,u*.36,'rgba(255,111,194,.20)');
  soft(W*.1,H*.88,u*.32,'rgba(67,214,124,.20)');
}
const deco={t:null,tm:0};
function decoReset(){deco.t=[[2,0,1,3],[1,3,2,0],[0,1,3,2],[3,2,0,1],[]];}
function decoStep(dt){
  if(!deco.t)decoReset();
  deco.tm-=dt;
  if(deco.tm>0)return;
  deco.tm=1.15;
  if(isSolvedState(deco.t,4)){decoReset();return;}
  const ms=genMoves(deco.t,4);
  if(!ms.length){decoReset();return;}
  const m=ms[Math.floor(Math.random()*ms.length)];
  for(let k=0;k<m.n;k++)deco.t[m.j].push(deco.t[m.i].pop());
}
function drawDeco(){
  const st=deco.t,n=st.length,tw=Math.min(40,W*.78/(n*1.34)),th=tw*4.2,gap=tw*.34,seg=(th-8)/4;
  const totalW=n*tw+(n-1)*gap,x0=W/2-totalW/2,y0=Math.max(18,H*.045);
  g.globalAlpha=.75;
  for(let i=0;i<n;i++){
    const r={x:x0+i*(tw+gap),y:y0,w:tw,h:th},a=st[i],inset=tw*.1;
    g.save();tubePath(r);g.clip();
    g.fillStyle='#EAF3FF';g.fillRect(r.x,r.y,r.w,r.h);
    for(let s=0;s<a.length;s++)liquidSeg(r.x+inset,r.y+r.h-6-(s+1)*seg,r.w-inset*2,seg,COL[a[s]],s===a.length-1);
    g.restore();
    g.lineWidth=3;g.strokeStyle='#C6D8EE';tubePath(r);g.stroke();
  }
  g.globalAlpha=1;
}
let blob={mood:'idle',t:0,blink:0};
function drawBlob(dt){
  blob.t+=dt;blob.blink-=dt;
  if(blob.blink<-.12)blob.blink=1.6+Math.random()*2.6;
  const bx=W*.5,by=H*.9-40,r=Math.min(30,W*.06);
  const bob=Math.sin(blob.t*2.1)*4;
  g.save();g.translate(bx,by+bob);
  g.beginPath();g.ellipse(0,r*1.15,r*1.1,r*.2,0,0,7);g.fillStyle='rgba(96,133,190,.18)';g.fill();
  drawFace(0,0,r,'#FFE07A','#FFB020',blob.mood,blob.blink<.1);
  g.restore();
  if(blob.t>1.4&&(blob.mood==='happy'||blob.mood==='sad'))blob.mood='idle';
}

let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;
  g.clearRect(0,0,W,H);
  paintBg();
  g.save();
  if(shake>0){shake-=dt*4;g.translate((Math.random()-.5)*shake*16,(Math.random()-.5)*shake*16);}
  if(playing&&cur){cur.update(dt,now);cur.draw(now);tickHud();}
  else if(view==='title'){decoStep(dt);drawDeco();drawBlob(dt);}
  drawParts(dt);
  g.restore();
  if(flash>0){flash-=dt*2.2;g.fillStyle='rgba(255,255,255,'+Math.max(0,flash*.35)+')';g.fillRect(0,0,W,H);}
  requestAnimationFrame(frame);
}

/* ================= input ================= */
function inGame(){return playing&&!finished&&view==='game'&&cur;}
cv.addEventListener('pointerdown',e=>{
  unlock();
  if(!inGame())return;
  e.preventDefault();
  if(cur.tap)cur.tap(e.clientX,e.clientY);
  if(cur.hold)cur.hold(e.clientX,e.clientY,true);
});
cv.addEventListener('pointermove',e=>{
  if(!inGame())return;
  if(cur.move)cur.move(e.clientX,e.clientY);
});
cv.addEventListener('pointerup',e=>{
  if(!inGame())return;
  if(cur.release)cur.release(e.clientX,e.clientY);
  if(cur.hold)cur.hold(e.clientX,e.clientY,false);
});
addEventListener('keydown',e=>{
  if(e.key==='u'&&cur&&cur.tools&&cur.tools.undo&&cur.undo)cur.undo();
});

/* ================= ui ================= */
const el=id=>document.getElementById(id);
const scrTitle=el('scrTitle'),scrEnd=el('scrEnd'),scrLevels=el('scrLevels'),scrIntro=el('scrIntro'),
      barTop=el('barTop'),barBot=el('barBot'),hudEl=el('hud');
function totalStars(){let n=0;for(const k in SAVE.best)if(k.endsWith('_s'))n+=SAVE.best[k];return n;}
function starRow(k){let s='';for(let i=0;i<3;i++)s+='<i class="st'+(i<k?'':' off')+'"></i>';return s;}
function hideAll(){scrTitle.hidden=true;scrEnd.hidden=true;scrLevels.hidden=true;scrIntro.hidden=true;
  barTop.hidden=true;barBot.hidden=true;hudEl.hidden=true;}
function showGame(){
  view='game';playing=true;finished=false;
  hideAll();barTop.hidden=false;barBot.hidden=false;
  updateHud();
}
function enterLevel(lv){
  unlock();startLevel(lv);
  const m=gameOf(lv);
  view='intro';playing=false;
  hideAll();scrIntro.hidden=false;
  el('iGlyph').textContent=m.icon;
  el('iGlyph').style.background='linear-gradient(180deg,'+shade(m.c,.24)+','+m.c+')';
  el('iLv').textContent='LEVEL '+lv+' OF '+MAX;
  el('iName').textContent=m.name;
  el('iName').style.color=m.c;
  el('iRule').textContent=m.rule;
  clearTimeout(introT);introT=setTimeout(()=>{if(view==='intro')showGame();},1700);
}
function showTitle(){
  view='title';playing=false;hideAll();scrTitle.hidden=false;
  const lv=Math.max(1,Math.min(MAX,SAVE.level||1));
  el('bPlay').textContent=lv>1?'Continue':'Play';
  el('bLevels').hidden=lv<=1;
  const mt=el('tMeta');
  mt.hidden=lv<=1;
  mt.innerHTML='<span>Level <b>'+lv+'</b>/'+MAX+'</span><span class="sep">·</span>'+
    '<span class="starsm">'+starRow(SAVE.best[lv+'_s']||0)+'</span><span class="sep">·</span>'+
    '<span><b>'+totalStars()+'</b>/'+(MAX*3)+' \u2605</span>';
}
function showLevels(){
  view='levels';playing=false;hideAll();scrLevels.hidden=false;
  const unlocked=Math.max(1,Math.min(MAX,SAVE.level||1));
  el('lvCount').textContent=totalStars();
  el('lvTotal').textContent=MAX*3;
  let h='';
  for(let n=1;n<=MAX;n++){
    const st=SAVE.best[n+'_s']||0,lock=n>unlocked,m=gameOf(n);
    let ss='';for(let k=0;k<3;k++)ss+='<i class="'+(k<st?'':'off')+'"></i>';
    h+='<button class="lvcell'+(lock?' lock':'')+(n===unlocked?' cur':'')+'" data-lv="'+n+'"'+
       (lock?' disabled':'')+' style="--c:'+m.c+'"><span class="ic">'+(lock?'🔒':m.icon)+'</span>'+
       '<span class="n">'+n+'</span><span class="ss">'+ss+'</span></button>';
  }
  el('lvGrid').innerHTML=h;
  const c2=el('lvGrid').querySelector('.cur');if(c2)c2.scrollIntoView({block:'center'});
}
function showEnd(ok,st){
  view='end';playing=false;
  hideAll();scrEnd.hidden=false;
  const m=gameOf(level);
  el('wLv').textContent='LEVEL '+level+' · '+m.name;
  el('wBig').textContent=ok?(st===3?'Perfect!':st===2?'Nice!':'Cleared!'):(lastMsg||'Failed');
  el('wBig').style.color=ok?'#22304F':'#E33E52';
  el('wStars').hidden=!ok;
  el('wSub').innerHTML=ok&&cur.summary?cur.summary():'Try it again — you have this.';
  if(ok)document.querySelectorAll('#wStars i').forEach((s,k)=>setTimeout(()=>s.classList.toggle('on',k<st),k*160));
  else document.querySelectorAll('#wStars i').forEach(s=>s.classList.remove('on'));
  el('wNext').textContent=!ok?'Retry':(level>=MAX?'Level select':'Next level');
}
el('bPlay').onclick=()=>{unlock();enterLevel(SAVE.level||1);};
el('bLevels').onclick=()=>{unlock();showLevels();};
el('lvBack').onclick=()=>showTitle();
el('lvGrid').onclick=e=>{
  const c=e.target.closest('.lvcell');if(!c||c.disabled)return;
  enterLevel(+c.dataset.lv);
};
scrIntro.onclick=()=>{if(view==='intro')showGame();};
el('bMenu').onclick=()=>{SAVE.level=Math.max(SAVE.level,level);save();showTitle();};
el('bUndo').onclick=()=>{if(cur&&cur.undo)cur.undo();};
el('bReset').onclick=()=>{startLevel(level);showGame();};
el('bHint').onclick=()=>{if(cur&&cur.hint)cur.hint();};
el('bSound').onclick=()=>{muted=!muted;SAVE.muted=muted;save();el('bSound').textContent=muted?'🔇':'🔊';};
el('wNext').onclick=()=>{
  if(!lastOk){startLevel(level);showGame();return;}
  if(level>=MAX){showLevels();return;}
  enterLevel(Math.min(MAX,level+1));
};
el('wAgain').onclick=()=>{startLevel(level);showGame();};
let tT=0;
function toast(t){const e=el('toastEl');e.textContent=t;e.hidden=false;requestAnimationFrame(()=>e.classList.add('on'));
  clearTimeout(tT);tT=setTimeout(()=>{e.classList.remove('on');setTimeout(()=>e.hidden=true,260);},1200);}

/* ================= boot ================= */
muted=!!SAVE.muted;
resize();startLevel(SAVE.level||1);showTitle();requestAnimationFrame(frame);

window.__pour={
  enter:enterLevel,start:lv=>{startLevel(lv);},play:()=>showGame(),
  game:()=>({level,id:LEVELS[level-1],name:gameOf(level).name}),
  state:()=>cur?{id:cur.gk||LEVELS[level-1],hud:cur.hud?cur.hud():null,finished,view}:null,
  dbg:()=>cur&&cur.dbg?cur.dbg():null,
  tap:(x,y)=>{if(inGame()&&cur&&cur.tap)cur.tap(x,y);},
  pointer:(k,x,y)=>{
    if(!inGame()||!cur)return;
    if(k==='down'){if(cur.tap)cur.tap(x,y);if(cur.hold)cur.hold(x,y,true);}
    else if(k==='move'){if(cur.move)cur.move(x,y);}
    else{if(cur.release)cur.release(x,y);if(cur.hold)cur.hold(x,y,false);}
  },
  win:st=>win(st),fail:msg=>fail(msg),
  solve:(st,c,lim)=>st?solveState(st.map(t=>t.slice()),c||cap,lim||20000):solveState(tubes.map(t=>t.slice()),cap,20000),
  rect:i=>tubeRect(i),hit:hitTube,makeSortLevel,genMoves,solveState,
  LEVELS,GAMES
};

</script>
</body>
