<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>POUR! — 60 different little games</title>
<meta name="description" content="POUR! is a collection of 60 tiny puzzle games — one new rule every level. Water sort, memory, timing, stacking and more. Free to play in your browser, works offline.">
<meta property="og:title" content="POUR! — 60 different little games">
<meta property="og:description" content="Every level is a different game. No repeats.">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233FA9FF'/%3E%3Crect x='9' y='4' width='14' height='24' rx='7' fill='%23F4FAFF'/%3E%3Cpath d='M10.6 17h10.8v3.4a5.4 5.4 0 0 1-10.8 0z' fill='%2343D67C'/%3E%3Crect x='10.6' y='12.4' width='10.8' height='4.6' fill='%23FFC531'/%3E%3Crect x='10.6' y='8.4' width='10.8' height='4' fill='%23FF5D5D'/%3E%3C/svg%3E">
<style>
:root{
  --ink:#22304F; --ink2:#61739A; --ink3:#9AAAC8;
  --sun:#FFC531; --sun-e:#C97F00;
  --star:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path d='M12 2.2l3.1 6.3 7 1-5.1 4.9 1.2 7L12 18l-6.2 3.4 1.2-7L2 9.5l7-1z'/></svg>")
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#EAF2FF;color:var(--ink);
  font-family:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0}
canvas#game{display:block;width:100%;height:100%;touch-action:none}

.screen{position:fixed;inset:0;display:grid;place-items:center;padding:20px;overflow:auto;scrollbar-width:none}
.screen::-webkit-scrollbar{display:none}
.card{max-width:400px;width:100%;text-align:center;padding:30px 26px 26px;border-radius:30px;background:#fff;
  box-shadow:0 22px 0 -6px rgba(190,214,244,.45),0 30px 60px rgba(96,133,190,.30);
  animation:pop .34s cubic-bezier(.2,1.5,.4,1)}
@keyframes pop{from{transform:scale(.86);opacity:0}to{transform:scale(1);opacity:1}}
.logo{margin:0;font-size:clamp(44px,13vw,68px);line-height:.95;font-weight:900;letter-spacing:-.01em;color:var(--ink)}
.logo i{font-style:normal;color:#3FA9FF}
.logo span{display:inline-block;transform:rotate(-4deg)}
.tag{margin:14px 0 24px;font-size:15px;line-height:1.6;color:var(--ink2);font-weight:700}
.tag b{color:var(--ink)}

.btn{font:inherit;font-weight:900;cursor:pointer;border:0;border-radius:20px;padding:15px 30px;
  font-size:17px;color:#fff;transition:transform .08s,box-shadow .08s,filter .1s}
.btn.sun{background:linear-gradient(180deg,#FFD75E,#FFC531);box-shadow:0 7px 0 var(--sun-e),0 14px 24px rgba(201,127,0,.28)}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:translateY(6px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn.ghost{background:#EDF3FC;color:var(--ink2);box-shadow:0 6px 0 #D5E1F2}
.btn.ghost:active{transform:translateY(5px);box-shadow:0 1px 0 #D5E1F2}
.fine{margin-top:20px;font-size:12.5px;color:var(--ink3);font-weight:700}

.meta{display:flex;gap:8px;justify-content:center;align-items:center;margin:0 0 20px;font-size:13px;font-weight:900;color:var(--ink2)}
.meta b{color:var(--ink)} .meta .sep{color:var(--ink3)}
.meta .starsm{display:inline-flex;gap:2px}
.st{width:14px;height:14px;display:inline-block;background:var(--sun);
  -webkit-mask:var(--star) center/contain no-repeat;mask:var(--star) center/contain no-repeat}
.st.off{background:#D8E3F2}
.row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:6px}

.bar{position:fixed;left:0;right:0;display:flex;align-items:center;justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top)) 14px 12px;pointer-events:none}
.bar.bot{bottom:0;gap:10px;justify-content:center;padding:12px 14px calc(18px + env(safe-area-inset-bottom))}
.pill{pointer-events:auto;cursor:pointer;font:inherit;font-weight:900;font-size:14px;padding:11px 18px;
  border-radius:16px;color:var(--ink2);border:0;background:#fff;
  box-shadow:0 5px 0 #D5E1F2,0 8px 16px rgba(96,133,190,.20);transition:transform .08s}
.pill:active{transform:translateY(5px);box-shadow:0 0 0 #D5E1F2}
.pill[disabled]{opacity:.42;pointer-events:none}
.pill.accent{color:#fff;background:linear-gradient(180deg,#77C5FF,#3FA9FF);box-shadow:0 5px 0 #14619F}
.pill.warn{color:#fff;background:linear-gradient(180deg,#FF8A8A,#FF5D5D);box-shadow:0 5px 0 #B72A3F}
.stat{pointer-events:none;text-align:center;background:#fff;border-radius:16px;padding:7px 18px 8px;box-shadow:0 5px 0 #D5E1F2}
.stat span{display:block;font-size:20px;font-weight:900;line-height:1.05}
.stat em{display:block;font-style:normal;font-size:9.5px;font-weight:900;letter-spacing:.16em;color:var(--ink3)}
#hud{position:fixed;left:0;right:0;top:calc(78px + env(safe-area-inset-top));text-align:center;pointer-events:none}
#hud b{display:inline-block;background:rgba(255,255,255,.92);border-radius:14px;padding:7px 16px;
  font-size:14.5px;font-weight:900;box-shadow:0 5px 0 #D5E1F2}

.stars{display:flex;gap:12px;justify-content:center;margin:14px 0 12px}
.stars i{width:46px;height:46px;display:block;background:#DDE7F5;transform:scale(.5);opacity:.5;
  -webkit-mask:var(--star) center/contain no-repeat;mask:var(--star) center/contain no-repeat}
.stars i.on{background:linear-gradient(180deg,#FFE07A,#FFB020);opacity:1;transform:scale(1);
  transition:transform .38s cubic-bezier(.2,1.7,.4,1);filter:drop-shadow(0 5px 0 rgba(201,127,0,.28))}
.winLv{font-size:12px;letter-spacing:.2em;font-weight:900;color:var(--ink3)}
.winBig{font-size:32px;font-weight:900;margin-top:4px}
.winSub{font-size:15px;color:var(--ink2);margin:2px 0 22px;font-weight:700}
.winSub b{color:var(--ink)}

.toast{position:fixed;top:44%;left:0;right:0;text-align:center;pointer-events:none;
  font-size:clamp(17px,4.6vw,22px);font-weight:900;color:#fff;text-shadow:0 4px 0 rgba(34,48,79,.35);
  opacity:0;transform:translateY(10px);transition:opacity .22s,transform .22s}
.toast.on{opacity:1;transform:translateY(0)}

.glyph{width:92px;height:92px;margin:0 auto 14px;border-radius:28px;display:grid;place-items:center;font-size:44px;
  color:#fff;box-shadow:0 9px 0 rgba(0,0,0,.16)}
.introK{font-size:12px;letter-spacing:.2em;font-weight:900;color:var(--ink3)}
.introN{font-size:38px;font-weight:900;margin:2px 0 8px}
.introR{font-size:15.5px;font-weight:700;color:var(--ink2);line-height:1.55;margin-bottom:16px}
.introGo{font-size:12.5px;font-weight:900;color:var(--ink3);letter-spacing:.1em}

#scrLevels{place-items:start center}
.lvwrap{width:100%;max-width:460px;padding-bottom:34px}
.lvhead{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:2;
  margin:-20px -20px 14px;padding:calc(16px + env(safe-area-inset-top)) 20px 12px;
  background:linear-gradient(180deg,#EAF2FF 62%,rgba(234,242,255,0))}
.lvtitle{font-size:22px;font-weight:900}
.lvcount{display:flex;align-items:center;gap:6px;font-size:14px;font-weight:900}
.lvgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.lvcell{--c:#3FA9FF;--cd:color-mix(in srgb,var(--c) 72%,#0B1A33);position:relative;aspect-ratio:1/1;border-radius:16px;
  cursor:pointer;border:0;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 24%,#fff),color-mix(in srgb,var(--c) 8%,#fff));
  box-shadow:0 5px 0 var(--cd);color:var(--ink);transition:transform .08s,filter .12s}
.lvcell:hover{filter:brightness(1.05)}
.lvcell:active{transform:translateY(5px);box-shadow:0 0 0 var(--cd)}
.lvcell .ic{font-size:22px;line-height:1.1}
.lvcell .n{font-size:10px;font-weight:900;color:var(--ink3)}
.lvcell .ss{display:flex;gap:2px}
.lvcell .ss i{width:8px;height:8px;display:block;background:var(--sun);
  -webkit-mask:var(--star) center/contain no-repeat;mask:var(--star) center/contain no-repeat}
.lvcell .ss i.off{background:#C9D7EA}
.lvcell.cur{outline:3px solid var(--ink);outline-offset:2px}
.lvcell.lock{--cd:#C6D5E8;pointer-events:none;background:#E4ECF8;color:#A9B8CF;box-shadow:0 5px 0 #C6D5E8}
.lvcell.lock .ss{display:none}
</style>
</head>
<body>
<div id="stage"><canvas id="game"></canvas></div>

<div id="barTop" class="bar" hidden>
  <button class="pill" id="bMenu">‹ Menu</button>
  <div class="stat"><span id="sLv">1</span><em id="sName">SORT</em></div>
  <button class="pill" id="bSound">🔊</button>
</div>
<div id="hud" hidden><b id="hudTxt"></b></div>
<div id="barBot" class="bar bot" hidden>
  <button class="pill" id="bUndo">↺ Undo</button>
  <button class="pill accent" id="bHint">✦ Hint</button>
  <button class="pill warn" id="bReset">⟳ Restart</button>
</div>

<section id="scrTitle" class="screen">
  <div class="card">
    <h1 class="logo">POUR<span><i>!</i></span></h1>
    <div class="tag"><b>60 levels, 60 different games.</b><br>No two levels play the same.</div>
    <div class="meta" id="tMeta"></div>
    <div class="row"><button class="btn sun" id="bPlay">Play</button><button class="btn ghost" id="bLevels">Levels</button></div>
    <div class="fine">Works offline · nothing leaves your device</div>
  </div>
</section>

<section id="scrIntro" class="screen" hidden>
  <div class="card">
    <div class="glyph" id="iGlyph">💧</div>
    <div class="introK" id="iLv">LEVEL 1</div>
    <div class="introN" id="iName">SORT</div>
    <div class="introR" id="iRule"></div>
    <div class="introGo">TAP TO START</div>
  </div>
</section>

<section id="scrLevels" class="screen" hidden>
  <div class="lvwrap">
    <div class="lvhead">
      <button class="pill" id="lvBack">‹</button>
      <div class="lvtitle">Levels</div>
      <div class="lvcount"><i class="st"></i><b id="lvCount">0</b>/<span id="lvTotal">180</span></div>
    </div>
    <div class="lvgrid" id="lvGrid"></div>
  </div>
</section>

<section id="scrEnd" class="screen" hidden>
  <div class="card">
    <div class="winLv" id="wLv">LEVEL 1</div>
    <div class="winBig" id="wBig">Nice!</div>
    <div class="stars" id="wStars"><i></i><i></i><i></i></div>
    <div class="winSub" id="wSub"></div>
    <div class="row"><button class="btn ghost" id="wAgain">Replay</button><button class="btn sun" id="wNext">Next</button></div>
  </div>
</section>

<div id="toastEl" class="toast" hidden></div>

<script>

/* ---- 10-base.js ---- */
"use strict";
/* ================= stage ================= */
const cv=document.getElementById('game'),g=cv.getContext('2d');
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=window.innerWidth;H=window.innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  g.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize',()=>{resize();if(cur&&cur.onResize)cur.onResize();});

/* ================= palette ================= */
const COL=['#FF5D5D','#3FA9FF','#FFC531','#43D67C','#A777FF','#FF8A3D','#22D3C5','#FF6FC2',
           '#8B5E34','#9BE564','#5B6C8E','#E0487F'];
const PAL=['#FF5D5D','#3FA9FF','#FFC531','#43D67C','#A777FF','#22D3C5','#FF6FC2','#FF8A3D','#9BE564'];

/* ================= canvas helpers ================= */
const FF='ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",Roboto,sans-serif';
const F=(w,s)=>w+' '+s+'px '+FF;
function hsl2hex(h,s,l){
  s/=100;l/=100;
  const a=s*Math.min(l,1-l);
  const f=n=>{const k=(n+h/30)%12;return l-a*Math.max(-1,Math.min(k-3,9-k,1));};
  const to=x=>Math.round(255*x).toString(16).padStart(2,'0');
  return '#'+to(f(0))+to(f(8))+to(f(4));
}
function shade(h,amt){
  if(h.charAt(0)!=='#')return h;
  if(h.length===4)h='#'+h[1]+h[1]+h[2]+h[2]+h[3]+h[3];
  const n=parseInt(h.slice(1),16);let r=n>>16&255,gg=n>>8&255,b=n&255;
  if(amt>0){r+=(255-r)*amt;gg+=(255-gg)*amt;b+=(255-b)*amt;}else{r*=1+amt;gg*=1+amt;b*=1+amt;}
  const to=x=>Math.round(Math.min(255,Math.max(0,x))).toString(16).padStart(2,'0');
  return '#'+to(r)+to(gg)+to(b);
}
function rrect(x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();
}
function candyRect(x,y,w,h,r,fill,press){
  const e=Math.max(4,h*.11)*(press?.35:1);
  rrect(x,y+e,w,h,r);g.fillStyle=shade(fill,-.45);g.fill();
  const lg=g.createLinearGradient(x,y,x,y+h);
  lg.addColorStop(0,shade(fill,.22));lg.addColorStop(1,shade(fill,-.05));
  rrect(x,y,w,h,r);g.fillStyle=lg;g.fill();
}
function candyCircle(x,y,r,fill,press){
  const e=r*(press?.28:.8);
  g.beginPath();g.arc(x,y+e,r,0,7);g.fillStyle=shade(fill,-.45);g.fill();
  const lg=g.createRadialGradient(x-r*.34,y-r*.42,r*.1,x,y,r);
  lg.addColorStop(0,shade(fill,.34));lg.addColorStop(1,shade(fill,-.08));
  g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=lg;g.fill();
}
function soft(x,y,r,c){
  const rg=g.createRadialGradient(x,y,0,x,y,r);
  rg.addColorStop(0,c);rg.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=rg;g.beginPath();g.arc(x,y,r,0,7);g.fill();
}
function shadowEll(x,y,rx){g.fillStyle='rgba(96,133,190,.20)';g.beginPath();g.ellipse(x,y,rx,rx*.24,0,0,7);g.fill();}
function drawFace(x,y,r,c1,c2,mood,blink){
  g.save();g.translate(x,y);
  const lg=g.createRadialGradient(-r*.3,-r*.42,r*.1,0,0,r);
  lg.addColorStop(0,shade(c1,.3));lg.addColorStop(1,c2||shade(c1,-.05));
  g.beginPath();g.ellipse(0,0,r,r*.94,0,0,7);g.fillStyle=lg;g.fill();
  g.strokeStyle=shade(c1,-.38);g.lineWidth=Math.max(1.4,r*.055);
  g.beginPath();g.ellipse(0,0,r,r*.94,0,0,7);g.stroke();
  const ex=r*.32,ey=-r*.12,er=r*.16;
  if(blink){
    g.strokeStyle='#22304F';g.lineWidth=Math.max(2,r*.09);g.lineCap='round';g.beginPath();
    g.moveTo(-ex-er,ey);g.lineTo(-ex+er,ey);g.moveTo(ex-er,ey);g.lineTo(ex+er,ey);g.stroke();
  }else{
    g.fillStyle='#22304F';
    g.beginPath();g.ellipse(-ex,ey,er,er*1.15,0,0,7);g.fill();
    g.beginPath();g.ellipse(ex,ey,er,er*1.15,0,0,7);g.fill();
    g.fillStyle='#fff';
    g.beginPath();g.ellipse(-ex-er*.3,ey-er*.4,er*.36,er*.36,0,0,7);g.fill();
    g.beginPath();g.ellipse(ex-er*.3,ey-er*.4,er*.36,er*.36,0,0,7);g.fill();
  }
  g.strokeStyle='#22304F';g.lineWidth=Math.max(2,r*.08);g.lineCap='round';g.beginPath();
  if(mood==='mad')g.arc(0,r*.52,r*.2,Math.PI+.4,-.4);
  else if(mood==='wow')g.arc(0,r*.34,r*.15,0,7);
  else g.arc(0,r*.22,r*.22,.25,Math.PI-.25);
  g.stroke();g.restore();
}
function txt(s,x,y,w,sz,c,align){
  g.font=F(w,sz);g.fillStyle=c;g.textAlign=align||'center';g.textBaseline='middle';
  g.fillText(s,x,y);g.textBaseline='alphabetic';
}
/* square board geometry shared by many games */
function board(size,bandPad){
  const b=playBand();
  const s=Math.min(W*(bandPad||.86),b.h-56,size||430);
  return {s,x:(W-s)/2,y:b.y+(b.h-s)/2+8};
}
function playBand(){const top=112,bot=H-128;return {y:top,h:Math.max(140,bot-top),cx:W/2};}
function timerBar(f,by){
  const bw=Math.min(W*.72,340),bx=(W-bw)/2,y=by==null?playBand().y+8:by;
  candyRect(bx,y,bw,16,8,'#DCE8F7',true);
  if(f>.001){
    g.save();rrect(bx+2,y+2,bw-4,12,6);g.clip();
    g.fillStyle=f>.35?'#43D67C':(f>.18?'#FFC531':'#FF5D5D');
    g.fillRect(bx+2,y+2,(bw-4)*Math.max(0,Math.min(1,f)),12);g.restore();
  }
  return {bx,by:y,bw};
}
function hearts(n){return '♥'.repeat(Math.max(0,n))+'♡'.repeat(Math.max(0,3-n));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuf(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));const t=a[i];a[i]=a[j];a[j]=t;}return a;}
function easeOut(t){return 1-Math.pow(1-t,3);}

/* ================= audio ================= */
let AC=null,muted=false;
function unlock(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}}if(AC.state==='suspended')AC.resume();}
function tone(f0,f1,dur,type,vol,delay){
  if(muted||!AC)return;
  const t=AC.currentTime+(delay||0),o=AC.createOscillator(),v=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);
  if(f1&&f1!==f0)o.frequency.exponentialRampToValueAtTime(Math.max(24,f1),t+dur);
  v.gain.setValueAtTime(.0001,t);v.gain.linearRampToValueAtTime(vol||.14,t+.012);
  v.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(v).connect(AC.destination);o.start(t);o.stop(t+dur+.05);
}
function blip(n){tone(n||520,(n||520)*1.5,.09,'triangle',.10);}
function pourSound(){tone(300,510,.13,'sine',.13);}
function glassSound(){tone(1400,900,.07,'triangle',.05);}
function buzz(){tone(150,90,.16,'sawtooth',.09);}
function popSound(){tone(700,1300,.08,'square',.07);}
function chime(){[0,.09,.18].forEach((d,i)=>tone(660*Math.pow(1.26,i),0,.22,'sine',.11,d));}
function ding(i){tone(520+i*70,0,.14,'triangle',.10);}
function fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,0,.34,'triangle',.12,i*.10));}
function sad(){[440,330,247].forEach((f,i)=>tone(f,f*.9,.32,'triangle',.10,i*.13));}

/* ================= save ================= */
const KEY='pour.save.v3';
let SAVE={level:1,best:{},muted:false};
try{const r=localStorage.getItem(KEY);if(r)SAVE=Object.assign(SAVE,JSON.parse(r));}catch(e){}
let saveT=0;
function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(SAVE));}catch(e){}},180);}

/* ================= particles ================= */
let parts=[],shake=0,flash=0;
function burst(x,y,col,n){
  for(let i=0;i<(n||10);i++){
    const a=Math.random()*Math.PI*2,s=70+Math.random()*230;
    parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-110,r:2.4+Math.random()*3.6,life:1,col});
  }
}
function confetti(){
  for(let i=0;i<70;i++)parts.push({x:Math.random()*W,y:-20-Math.random()*H*.3,vx:(Math.random()-.5)*120,
    vy:60+Math.random()*160,r:3+Math.random()*4,life:1.6,col:COL[Math.floor(Math.random()*8)]});
}
function drawParts(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.life-=dt*1.1;
    if(p.life<=0){parts.splice(i,1);continue;}
    p.vy+=780*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;
    g.globalAlpha=Math.max(0,Math.min(1,p.life));g.fillStyle=p.col;
    rrect(p.x-p.r,p.y-p.r,p.r*2,p.r*2,p.r*.45);g.fill();g.globalAlpha=1;
  }
}

/* ================= SORT engine (level 1) ================= */
function rngOf(seed){let s=seed>>>0||1;return()=>{s^=s<<13;s>>>=0;s^=s>>17;s^=s<<5;s>>>=0;return s/4294967296;};}
function keyOf(st){return st.map(t=>t.join(',')).sort().join('|');}
function isSolvedState(st,cap){return st.every(t=>!t.length||(t.length===cap&&t.every(c=>c===t[0])));}
function genMoves(st,cap){
  const out=[];
  for(let i=0;i<st.length;i++){
    const a=st[i];if(!a.length)continue;
    const col=a[a.length-1];let run=1;while(run<a.length&&a[a.length-1-run]===col)run++;
    if(a.length===cap&&run===a.length)continue;
    for(let j=0;j<st.length;j++){
      if(i===j)continue;const b=st[j];
      if(b.length>=cap)continue;
      if(b.length&&b[b.length-1]!==col)continue;
      if(!b.length&&run===a.length)continue;
      const n=Math.min(run,cap-b.length);
      const ns=st.map(t=>t.slice());
      for(let k=0;k<n;k++)ns[j].push(ns[i].pop());
      out.push({i,j,n,ns,score:(b.length?0:50)-n*2+(b.length&&b.length+n===cap?-30:0)});
    }
  }
  out.sort((x,y)=>x.score-y.score);return out;
}
function solveState(st,cap,limit){
  if(isSolvedState(st,cap))return[];
  const seen=new Set();let nodes=0;
  function dfs(s,path){
    if(isSolvedState(s,cap))return path;
    if(++nodes>limit)return null;
    const k=keyOf(s);if(seen.has(k))return null;seen.add(k);
    for(const m of genMoves(s,cap)){const r=dfs(m.ns,path.concat([m]));if(r)return r;if(nodes>limit)return null;}
    return null;
  }
  return dfs(st,[]);
}
function scramble(colors,extra,cap,rnd){
  const bag=[];for(let c=0;c<colors;c++)for(let k=0;k<cap;k++)bag.push(c);
  for(let i=bag.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));const t=bag[i];bag[i]=bag[j];bag[j]=t;}
  const st=[];for(let c=0;c<colors;c++)st.push(bag.slice(c*cap,c*cap+cap));
  for(let e=0;e<extra;e++)st.push([]);
  return st;
}
function makeSortLevel(colors,extra){
  const cap=4;
  for(let a=0;a<60;a++){
    const st=scramble(colors,extra,cap,rngOf(a*7919+colors*97+13));
    if(isSolvedState(st,cap))continue;
    const sol=solveState(st,cap,14000);
    if(sol&&sol.length)return {tubes:st.map(t=>t.slice()),cap,par:Math.max(4,Math.round(sol.length*1.25))};
  }
  const st=scramble(3,1,cap,rngOf(7));return {tubes:st,cap,par:8};
}

/* ================= shared grid helpers ================= */
function cellGeom(cols,rows,pad,capSz){
  const b=playBand();
  const availH=Math.max(80,b.h-70);
  let w=Math.min(W*(pad==null?.86:pad),capSz||440);
  const gap=Math.max(4,Math.min(w,availH)*.045);
  let cw=(w-gap*(cols-1))/cols,ch=cw;
  if(ch*rows+gap*(rows-1)>availH){ch=(availH-gap*(rows-1))/rows;cw=ch;w=cw*cols+gap*(cols-1);}
  const hh=ch*rows+gap*(rows-1);
  return {cols,rows,gap,cw,ch,w,h:hh,x:(W-w)/2,y:b.y+(b.h-hh)/2+10};
}
function cellAt(G,i){return {x:G.x+(i%G.cols)*(G.cw+G.gap),y:G.y+Math.floor(i/G.cols)*(G.ch+G.gap)};}
function cellMid(G,i){const p=cellAt(G,i);return {x:p.x+G.cw/2,y:p.y+G.ch/2};}
function hitCell(G,i,x,y,sl){const p=cellAt(G,i);sl=sl||4;
  return x>=p.x-sl&&x<=p.x+G.cw+sl&&y>=p.y-sl&&y<=p.y+G.ch+sl;}
function findCell(G,x,y,n,sl){for(let i=0;i<(n==null?G.cols*G.rows:n);i++)if(hitCell(G,i,x,y,sl))return i;return -1;}
function fillCell(G,i,r,fill,press){const p=cellAt(G,i);candyRect(p.x,p.y,G.cw,G.ch,r==null?G.cw*.22:r,fill,press);return p;}
function lbl(s,x,y,sz,c,al){txt(s,x,y,'900',sz||14,c||'#22304F',al||'center');}

/* ---- 30-g1.js ---- */
/* ================= SORT machinery (level 1) ================= */
let tubes=[],cap=4,par=8,moves=0,undoStack=[],sel=-1,lift=0;
let flyers=[],appear=new Map(),hintPair=null,hintT=0;
let L={tw:44,th:230,gap:16,seg:0,wall:5,rows:1,cols:6,n:6,y0:40};

function topRun(t){const a=tubes[t];if(!a.length)return 0;const c=a[a.length-1];let n=1;while(n<a.length&&a[a.length-1-n]===c)n++;return n;}
function isTubeDone(t){const a=tubes[t];return a.length===cap&&a.every(c=>c===a[0]);}
function canPour(i,j){
  if(i===j||!tubes[i].length||tubes[j].length>=cap)return false;
  const c=tubes[i][tubes[i].length-1];
  if(tubes[j].length&&tubes[j][tubes[j].length-1]!==c)return false;
  return topRun(i)>0;
}
function layout(){
  const n=tubes.length||6;
  const wide=W>H*1.1;
  const rows=(!wide&&n<=5)||(wide&&n<=9)?1:2;
  const cols=Math.ceil(n/rows);
  const band=playBand();
  const availW=Math.min(W*.9,760);
  const availH=rows===1?Math.min(band.h*.62,340):(band.h-46)/2;
  let tw=Math.min(76,availW/(cols*1.28),availH/4.6);
  tw=Math.max(22,tw);
  const gap=tw*.34;
  const th=Math.min(availH,tw*4.6);
  const stackH=rows*th+(rows-1)*46;
  L={tw,th,gap,seg:(th-14)/cap,wall:Math.max(3,tw*.11),rows,cols,n,y0:band.y+(band.h-stackH)/2};
}
function tubeRect(i){
  const per=L.cols,row=Math.floor(i/per),col=i%per;
  const inRow=Math.min(per,L.n-row*per);
  const w=inRow*L.tw+(inRow-1)*L.gap;
  const x0=W/2-w/2;
  return {x:x0+col*(L.tw+L.gap),y:L.y0+row*(L.th+46),w:L.tw,h:L.th};
}
function segPos(t,idx){const r=tubeRect(t);return {x:r.x+r.w/2,y:r.y+r.h-10-(idx+.5)*L.seg};}
function pour(i,j){
  if(!canPour(i,j))return false;
  const col=tubes[i][tubes[i].length-1];
  const n=Math.min(topRun(i),cap-tubes[j].length);
  const before=tubes[j].length;
  for(let k=0;k<n;k++)tubes[j].push(tubes[i].pop());
  for(let k=0;k<n;k++){
    const from=segPos(i,before+k),to=segPos(j,before+k);
    const at=performance.now()+140+k*95;
    flyers.push({col,x0:from.x,y0:from.y-18,x1:to.x,y1:to.y,t0:at,dur:230});
    appear.set(j+':'+(before+k),at+120);
  }
  undoStack.push({i,j,n});
  moves++;updateHud();
  glassSound();
  if(isTubeDone(j)){chime();flash=1;burst(segPos(j,cap-1).x,segPos(j,0).y,COL[col],24);}
  return true;
}
function undoPour(){
  const m=undoStack.pop();if(!m)return;
  for(let k=0;k<m.n;k++){const s=tubes[m.j].pop();tubes[m.i].push(s);appear.delete(m.j+':'+tubes[m.j].length);}
  moves=Math.max(0,moves-1);sel=-1;flyers.length=0;updateHud();blip(360);
}
function hitTube(x,y){for(let i=0;i<tubes.length;i++){const r=tubeRect(i);if(x>=r.x-9&&x<=r.x+r.w+9&&y>=r.y-34&&y<=r.y+r.h+9)return i;}return -1;}
function tubePath(r){
  const rad=r.w/2,top=r.w*.22;
  g.beginPath();
  g.moveTo(r.x,r.y+top*.3);
  g.lineTo(r.x,r.y+r.h-rad);
  g.arc(r.x+rad,r.y+r.h-rad,rad,Math.PI,0,true);
  g.lineTo(r.x+r.w,r.y+top*.3);
  g.closePath();
}
function liquidSeg(x,y,w,h,col,last){
  g.fillStyle=col;g.fillRect(x,y,w,h+1);
  const lg=g.createLinearGradient(x,y,x,y+h);
  lg.addColorStop(0,'rgba(255,255,255,.26)');lg.addColorStop(.42,'rgba(255,255,255,0)');
  lg.addColorStop(1,'rgba(0,0,.12)');
  g.fillStyle=lg;g.fillRect(x,y,w,h+1);
  if(last){
    g.fillStyle='rgba(255,255,255,.4)';
    g.beginPath();g.ellipse(x+w/2,y+1.5,w/2-1,Math.min(5,h*.09),0,0,7);g.fill();
  }
}
function drawTube(i){
  const r=tubeRect(i),t=tubes[i],inset=r.w*.1,isSel=sel===i,done=isTubeDone(i);
  const dy=isSel?-lift*18:0;
  const R={x:r.x,y:r.y+dy,w:r.w,h:r.h};
  shadowEll(r.x+r.w/2,r.y+r.h+4,r.w*.5);
  g.save();tubePath(R);g.clip();
  g.fillStyle='#EAF3FF';g.fillRect(R.x,R.y,R.w,R.h);
  for(let s=0;s<t.length;s++){
    const fromTop=t.length-1-s;
    const ap=appear.get(i+':'+s);
    if(ap&&performance.now()<ap)continue;
    liquidSeg(R.x+inset,R.y+R.h-10-(s+1)*L.seg,R.w-inset*2,L.seg,COL[t[s]],fromTop===0);
  }
  g.restore();
  g.lineWidth=isSel||done?4:3;
  g.strokeStyle=isSel?'#22304F':done?'#22AF5F':'#C6D8EE';
  tubePath(R);g.stroke();
  g.strokeStyle='rgba(255,255,255,.5)';g.lineWidth=Math.max(2,r.w*.06);g.lineCap='round';
  g.beginPath();g.moveTo(R.x+r.w*.24,R.y+12);g.lineTo(R.x+r.w*.24,R.y+R.h-r.w*.72);g.stroke();
  if(done){
    g.fillStyle='rgba(34,175,95,.16)';tubePath(R);g.fill();
    candyCircle(R.x+R.w*.68,R.y+R.h-r.w*.5,r.w*.2,'#43D67C');
    g.strokeStyle='#fff';g.lineWidth=Math.max(2,r.w*.11);g.lineCap='round';g.lineJoin='round';
    g.beginPath();g.moveTo(R.x+R.w*.55,R.y+R.h-r.w*.5);
    g.lineTo(R.x+R.w*.66,R.y+R.h-r.w*.4);g.lineTo(R.x+R.w*.8,R.y+R.h-r.w*.63);g.stroke();
  }
}

def('sort',{name:'SORT',icon:'💧',c:'#3FA9FF',
  rule:'Pour water between the tubes. Finish when every tube holds one colour only.',
  tools:{undo:true,hint:true},
  make(){
    const d=makeSortLevel(4,2);
    tubes=d.tubes;cap=d.cap;par=d.par;moves=0;undoStack=[];sel=-1;lift=0;
    flyers=[];appear.clear();hintPair=null;
    layout();
    return {
      gk:'sort',
      onResize:layout,
      update(){lift+=((sel>=0?1:0)-lift)*.22;},
      draw(){
        for(let i=0;i<tubes.length;i++)drawTube(i);
        const now=performance.now();
        for(let i=flyers.length-1;i>=0;i--){
          const f=flyers[i],t=(now-f.t0)/f.dur;
          if(t<0)continue;
          if(t>=1){flyers.splice(i,1);continue;}
          const e=1-Math.pow(1-t,2);
          const x=f.x0+(f.x1-f.x0)*e,y=f.y0+(f.y1-f.y0)*e-Math.sin(Math.PI*t)*70;
          g.fillStyle=COL[f.col];
          rrect(x-L.seg*.42,y-L.seg*.42,L.seg*.84,L.seg*.84,L.seg*.34);g.fill();
          if(t>.55&&!f.did){f.did=1;tone(300,510,.13,'sine',.13);}
        }
        if(hintPair&&now-hintT<1600){
          const a=segPos(hintPair.i,cap),b=segPos(hintPair.j,cap);
          g.globalAlpha=.55+Math.sin(now/120)*.3;g.strokeStyle='#FF8A3D';g.lineWidth=4;g.lineCap='round';
          g.setLineDash([9,9]);
          g.beginPath();g.moveTo(a.x,a.y-24);g.quadraticCurveTo((a.x+b.x)/2,Math.min(a.y,b.y)-96,b.x,b.y-24);g.stroke();
          g.setLineDash([]);g.globalAlpha=1;
        }
      },
      tap(x,y){
        let i=hitTube(x,y);
        hintPair=null;
        if(i<0){sel=-1;return;}
        if(sel===i){sel=-1;blip(380);return;}
        if(sel>=0){
          if(pour(sel,i)){if(isSolvedState(tubes,cap))win(moves<=par?3:moves<=Math.round(par*1.6)?2:1);sel=-1;}
          else{buzz();shake=1;sel=tubes[i].length?i:-1;}
          return;
        }
        if(!tubes[i].length||isTubeDone(i)){blip(300);return;}
        sel=i;blip(620);
      },
      undo:undoPour,
      hint(){
        const sol=solveState(tubes.map(t=>t.slice()),cap,4000);
        if(sol&&sol.length){hintPair=sol[0];hintT=performance.now();blip(880);}
        else{buzz();toast('Stuck — undo or restart');}
      },
      hud(){return moves+' moves · par '+par;},
      summary(){return '<b>'+moves+'</b> moves · par <b>'+par+'</b>';}
    };
  }});

def('spot',{name:'SPOT',icon:'🔍',c:'#FF6FC2',
  rule:'One tile is a shade off the rest. Find it before the bar runs out.',
  make(){
    const dim=4,total=7,limit=4.2;
    let round=0,hp=3,time=limit,tiles=[],odd=-1,G=null,flashT=0,bad=-1,reveal=-1;
    function nextRound(){
      const rnd=Math.random,h=Math.floor(rnd()*360),d=13,baseL=52+(rnd()<.5?-d*.4:d*.4);
      const ol=Math.max(14,Math.min(88,baseL+(rnd()<.5?-d:d)));
      tiles=[];odd=Math.floor(rnd()*dim*dim);
      for(let i=0;i<dim*dim;i++)tiles.push(i===odd?hsl2hex((h+3)%360,92,ol):hsl2hex(h,78,baseL));
      time=limit;bad=-1;reveal=-1;
    }
    function geom(){G=cellGeom(dim,dim,.8);}
    geom();nextRound();
    return {
      gk:'spot',onResize:geom,
      update(dt){
        if(cur!==this||finished)return;
        time-=dt;
        if(flashT>0)flashT-=dt;
        if(time<=0){
          hp--;buzz();shake=1;
          if(hp<=0){fail('Time ran out');return;}
          toast('It was this one');reveal=odd;time=limit;
          setTimeout(()=>{if(playing&&!finished)nextRound();},760);
        }
      },
      draw(){timerBar(Math.max(0,time/limit));
        for(let i=0;i<tiles.length;i++){
          const p=cellAt(G,i);let sc=1;
          if(i===bad&&flashT>0)sc=1-.06*Math.sin(flashT*30);
          const o=(G.cw*(1-sc))/2;
          candyRect(p.x+o,p.y+o,G.cw*sc,G.ch*sc,G.cw*.26,tiles[i]);
          if(i===bad&&flashT>0){g.strokeStyle='#22304F';g.lineWidth=3;rrect(p.x,p.y,G.cw,G.ch,G.cw*.26);g.stroke();}
          if(i===reveal){g.strokeStyle='#22304F';g.lineWidth=4;g.setLineDash([7,7]);
            rrect(p.x-4,p.y-4,G.cw+8,G.ch+8,G.cw*.3);g.stroke();g.setLineDash([]);}
        }},
      tap(x,y){
        if(reveal>=0)return;
        const i=findCell(G,x,y);if(i<0)return;
        if(i===odd){
          round++;popSound();burst(x,y,tiles[i],16);tone(880,1200,.1,'triangle',.08);
          if(round>=total){win(hp===3?3:hp===2?2:1);return;}
          nextRound();
        }else{bad=i;flashT=.4;time-=.6;buzz();shake=.7;}
      },
      hud(){return 'tile '+(round+1)+'/'+total+'   '+hearts(hp);},
      dbg(){return {odd,dim,G,round,total,hp};},
      summary(){return 'found all <b>'+total+'</b> odd tiles';}
    };
  }});

/* ================= POP (level 3) ================= */
def('pop',{name:'POP',icon:'🐣',c:'#FF8A3D',
  rule:'Boop the little guys as they rise. Leave the dark ones alone.',
  make(){
    const dim=4,n=dim*dim,target=14,timeMax=38;
    const spawnEvery=.85,life=1.3;
    let cells=[],spawnT=.3,score=0,hp=3,time=timeMax,G=null;
    for(let i=0;i<n;i++)cells.push({type:0,age:0,life:0});
    const PAL5=['#FFC531','#43D67C','#3FA9FF','#A777FF','#FF6FC2'];
    function geom(){G=cellGeom(dim,dim,.84);}
    geom();
    return {
      gk:'pop',onResize:geom,
      update(dt){
        if(cur!==this||finished)return;
        time-=dt;
        if(time<=0){if(score>=target)win(hp===3?3:hp===2?2:1);else fail('Time up');return;}
        for(const c of cells){if(c.type){c.age+=dt;if(c.age>c.life){c.type=0;c.age=0;}}}
        spawnT-=dt;
        if(spawnT<=0){
          spawnT=spawnEvery*(.7+Math.random()*.6);
          const free=[];for(let i=0;i<n;i++)if(!cells[i].type)free.push(i);
          if(free.length){
            const i=free[Math.floor(Math.random()*free.length)];
            const bomb=Math.random()<.26;
            cells[i]={type:bomb?2:1,age:0,life:bomb?life*1.15:life};
          }
        }
      },
      draw(){timerBar(Math.max(0,time/timeMax));
        for(let i=0;i<n;i++){
          const m=cellMid(G,i),c=cells[i],cs=G.cw;
          shadowEll(m.x,m.y+cs*.44,cs*.44);
          g.fillStyle='#BCCFE8';g.beginPath();g.arc(m.x,m.y,cs*.46,0,7);g.fill();
          g.fillStyle='#8FAFCF';g.beginPath();g.arc(m.x,m.y+cs*.03,cs*.38,0,7);g.fill();
          if(!c.type)continue;
          const t0=Math.min(1,c.age/.14);
          const rise=c.age>c.life-.16?Math.max(0,(c.life-c.age)/.16):1;
          const e=easeOut(t0)*Math.min(rise,1);
          const r=cs*.36,yy=m.y+cs*.9-cs*1.2*e;
          g.save();g.beginPath();g.rect(m.x-cs*.7,m.y-cs*1.3,cs*1.4,cs*1.3+cs*.12);g.clip();
          if(c.type===1)drawFace(m.x,yy,r,PAL5[i%5],null,'idle',c.age>life*.5&&c.age<life*.56);
          else{
            g.fillStyle='#22304F';g.beginPath();g.arc(m.x,yy,r*.86,0,7);g.fill();
            g.fillStyle='rgba(255,255,255,.26)';g.beginPath();g.ellipse(m.x-r*.3,yy-r*.36,r*.26,r*.17,-.5,0,7);g.fill();
            g.strokeStyle='#8B5E34';g.lineWidth=r*.12;g.lineCap='round';
            g.beginPath();g.moveTo(m.x+r*.2,yy-r*.8);g.quadraticCurveTo(m.x+r*.62,yy-r*1.2,m.x+r*.44,yy-r*1.5);g.stroke();
            const fl=.6+Math.sin(performance.now()/60)*.4;
            g.fillStyle='#FFC531';g.beginPath();g.arc(m.x+r*.44,yy-r*1.56,r*.18*fl+1,0,7);g.fill();
            g.fillStyle='#FF5D5D';g.beginPath();g.arc(m.x+r*.44,yy-r*1.56,r*.1*fl,0,7);g.fill();
          }
          g.restore();
        }},
      tap(x,y){
        const i=findCell(G,x,y);if(i<0)return;
        const m=cellMid(G,i),px=x-m.x,py=y-m.y;
        if(px*px+py*py>(G.cw*.55)*(G.cw*.55))return;
        const c=cells[i];if(!c.type)return;
        if(c.type===1){
          score++;popSound();burst(x,y,PAL5[i%5],14);c.type=0;c.age=0;
          if(score>=target)win(hp===3?3:hp===2?2:1);
        }else{
          hp--;c.type=0;c.age=0;buzz();shake=1;
          if(hp<=0)fail('Too many bombs');
        }
      },

def('echo',{name:'ECHO',icon:'🎵',c:'#A777FF',
  rule:'Watch the pads play their tune, then tap it back in the same order.',
  make(){
    const total=4,cols=3,rows=2,npad=cols*rows,baseLen=2;
    const stepOn=.44;
    let seq=[],pos=0,phase='pre',hp=3,round=1,showT=.5,lit=-1,bad=-1,badT=0,G=null,pw=0,ph=0;
    const PC=['#FF5D5D','#3FA9FF','#FFC531','#43D67C','#A777FF','#22D3C5'];
    function geom(){G=cellGeom(cols,rows,.78);pw=G.cw;ph=G.ch;}
    function newRound(){
      const len=baseLen+round;
      seq=[];for(let i=0;i<len;i++)seq.push(Math.floor(Math.random()*npad));
      pos=0;phase='pre';showT=.5;lit=-1;
    }
    geom();newRound();
    function padRect(i){const p=cellAt(G,i);return {x:p.x,y:p.y,w:G.cw,h:G.ch};}
    return {
      gk:'echo',onResize:geom,
      update(dt){
        if(cur!==this||finished)return;
        if(badT>0)badT-=dt;
        if(phase==='wait'||phase==='input')return;
        showT-=dt;if(showT>0)return;
        if(phase==='pre'){phase='show';pos=0;lit=seq[0];tone(300+seq[0]*80,0,.16,'sine',.12);showT=stepOn;return;}
        if(lit>=0){lit=-1;showT=stepOn*.4;pos++;if(pos>=seq.length){phase='input';pos=0;return;}}
        else{lit=seq[pos];tone(300+lit*80,0,.16,'sine',.12);showT=stepOn;}
      },
      draw(){
        const rad=Math.min(pw,ph)*.24;
        for(let i=0;i<npad;i++){
          const r=padRect(i),on=phase==='show'&&lit===i,c=PC[i%PC.length];
          candyRect(r.x,r.y,r.w,r.h,rad,on?shade(c,.5):c);
          if(on){g.fillStyle='rgba(255,255,255,.5)';rrect(r.x,r.y,r.w,r.h,rad);g.fill();
            g.strokeStyle='#fff';g.lineWidth=4;rrect(r.x+2,r.y+2,r.w-4,r.h-4,rad-2);g.stroke();}
          if(i===bad&&badT>0){
            g.strokeStyle='#22304F';g.lineWidth=5;g.lineCap='round';const q=Math.min(r.w,r.h)*.18;
            g.beginPath();g.moveTo(r.x+r.w/2-q,r.y+r.h/2-q);g.lineTo(r.x+r.w/2+q,r.y+r.h/2+q);
            g.moveTo(r.x+r.w/2+q,r.y+r.h/2-q);g.lineTo(r.x+r.w/2-q,r.y+r.h/2+q);g.stroke();
          }
          if(phase==='input'&&!on){g.fillStyle='rgba(255,255,255,.5)';
            g.beginPath();g.arc(r.x+r.w/2,r.y+r.h/2,Math.min(r.w,r.h)*.09,0,7);g.fill();}
        }
        lbl(phase==='input'?'YOUR TURN':'WATCH',W/2,playBand().y+20,15,'#61739A');
      },
      tap(x,y){
        if(phase!=='input')return;

        if(i===seq[pos]){
          tone(300+i*80,0,.16,'sine',.12);burst(x,y,PC[i%PC.length],8);pos++;
          if(pos>=seq.length){
            if(round>=total){win(hp===3?3:hp===2?2:1);}
            else{round++;chime();newRound();}
            return;
          }
        }else{
          hp--;bad=i;badT=.4;buzz();shake=1;
          if(hp<=0){fail('Lost the pattern');return;}
          toast('Watch again');pos=0;phase='pre';showT=.8;lit=-1;
        }
      },
      hud(){return 'pattern '+round+'/'+total+'   '+hearts(hp);},
      dbg(){return {seq:seq.slice(),pos,phase,G,cols,npad,hp,round,total};},
      summary(){return 'remembered <b>'+total+'</b> patterns';}
    };
  }});

def('rings',{name:'RINGS',icon:'🎯',c:'#FF5D5D',
  rule:'A notch rides the spinning ring. Tap when it lines up with the marker.',
  make(){
    let rot=0,dir=1,sp=1.9,need=6,hits=0,hp=3,gapC=.6,gapW=.62,cool=0,jx=0;
    const TOP=-Math.PI/2;
    function geom(){const b=playBand();const R=Math.min(W*.34,b.h*.38,168);
      return {cx:W/2,cy:b.y+b.h/2,R};}
    function gapAng(){return gapC+rot;}
    function diff(a,b){let d=(a-b)%(Math.PI*2);if(d>Math.PI)d-=Math.PI*2;if(d<-Math.PI)d+=Math.PI*2;return d;}
    return {
      gk:'rings',
      update(dt){
        if(cur!==this||finished)return;
        rot+=dir*sp*dt;jx*=.86;
        if(cool>0)cool-=dt;
      },
      draw(){
        const {cx,cy,R}=geom(),th=R*.2;
        g.strokeStyle='#DCE8F7';g.lineWidth=th;g.beginPath();g.arc(cx,cy,R,0,7);g.stroke();
        const a0=gapAng()+gapW/2,a1=gapAng()-gapW/2;
        g.strokeStyle='#FF5D5D';g.lineCap='round';g.lineWidth=th;
        g.beginPath();g.arc(cx,cy,R,a0,a1);g.stroke();
        g.strokeStyle='rgba(255,255,255,.32)';g.lineWidth=th*.32;
        g.beginPath();g.arc(cx,cy,R+th*.24,a0,a1);g.stroke();
        candyCircle(cx,cy,R*.34,'#FFC531');
        drawFace(cx,cy,R*.3,'#FFE07A','#FFB020',jx>0?'mad':'idle',false);
        // marker
        g.save();g.translate(cx,cy-R-th*.7);
        g.fillStyle='#22304F';g.beginPath();g.moveTo(0,th*.5);g.lineTo(-th*.42,-th*.36);g.lineTo(th*.42,-th*.36);g.closePath();g.fill();
        g.restore();
        if(jx>0){g.strokeStyle='rgba(255,93,93,'+jx+')';g.lineWidth=8;g.beginPath();g.arc(cx,cy,R+th,0,7);g.stroke();}
      },
      tap(x,y){
        const {cx,cy,R}=geom();
        if(Math.abs(x-cx)>R*1.8||Math.abs(y-cy)>R*1.8)return;
        const d=Math.abs(diff(gapAng(),TOP));
        if(d<gapW*.62){
          hits++;jx=0;ding(hits);burst(cx,cy-R,'#FF5D5D',16);
          gapC=Math.random()*Math.PI*2;sp=Math.min(6.2,sp*1.16);gapW=Math.max(.3,gapW*.92);
          if(hits>=need)win(hp===3?3:hp===2?2:1);
        }else{
          hp--;jx=1;buzz();shake=1;
          if(hp<=0){fail('Missed the notch');return;}
          gapC=Math.random()*Math.PI*2;
        }
      },
      hud(){return hits+'/'+need+'   '+hearts(hp);},
      summary(){return 'locked <b>'+need+'</b> notches';}
    };
  }});

def('ascend',{name:'ASCEND',icon:'⛰',c:'#43D67C',
  rule:'Numbers are scattered everywhere. Tap them from 1 upward, as fast as you can.',
  make(){
    const N=12,limit=22;
    let next=1,time=limit,hp=3,pos=[],bad=-1,badT=0,done=[];
    function geom(){
      const f=playBand(),w=Math.min(W*.88,430),h=Math.min(f.h-70,w*1.15),x=(W-w)/2,y=f.y+34;
      pos=[];let tries=0;
      while(pos.length<N&&tries<3000){
        tries++;
        const r=Math.min(w,h)*.085;
        const p={x:x+r+Math.random()*(w-2*r),y:y+r+Math.random()*(h-2*r),r};
        if(pos.every(q=>Math.hypot(q.x-p.x,q.y-p.y)>q.r+p.r+6))pos.push(p);
      }
      while(pos.length<N)pos.push({x:Math.random()*w,y:Math.random()*h,r:20});
    }
    geom();shuf(pos);
    return {
      gk:'ascend',onResize:geom,
      update(dt){
        if(cur!==this||finished)return;
        time-=dt;if(badT>0)badT-=dt;
        if(time<=0){hp--;buzz();shake=1;if(hp<=0){fail('Out of time');return;}time=limit;}
      },
      draw(){
        timerBar(Math.max(0,time/limit));
        const f=playBand(),w=Math.min(W*.88,430),h=Math.min(f.h-70,w*1.15);
        candyRect((W-w)/2,f.y+34,w,h,22,'#EAF6EE',true);
        for(let i=0;i<pos.length;i++){
          const p=pos[i],num=i+1;
          const st=done.indexOf(i)>=0;
          candyCircle(p.x,p.y,p.r,st?'#9BE564':(num===next?'#43D67C':'#C6D8EE'));
          lbl(String(num),p.x,p.y,Math.min(26,p.r*1.05),st?'#22304F':'#fff');
          if(i===bad&&badT>0){g.strokeStyle='#FF5D5D';g.lineWidth=5;g.beginPath();g.arc(p.x,p.y,p.r+5,0,7);g.stroke();}
        }
        lbl('find '+next,W/2,f.y+18,14,'#61739A');
      },
      tap(x,y){
        for(let i=pos.length-1;i>=0;i--){const p=pos[i];
          if(Math.hypot(x-p.x,y-p.y)<=p.r+4){
            if(done.indexOf(i)>=0)return;
            if(i+1===next){
              done.push(i);next++;ding(next);burst(p.x,p.y,'#43D67C',12);
              if(next>N){win(time>limit*.5?3:time>limit*.25?2:1);}
            }else{bad=i;badT=.5;buzz();shake=.7;time-=1.2;}
            return;
          }}

      hud(){return 'next '+Math.min(next,N+1)+' · '+hearts(hp);},
      dbg(){return {next,N,pos:pos.slice(),done:done.slice(),hp};},
      summary(){return 'climbed all <b>'+N+'</b> steps';}
    };
  }});

def('stack',{name:'STACK',icon:'🧱',c:'#8B5E34',
  rule:'A block slides back and forth. Tap to drop it and keep the tower tall.',
  make(){
    const need=11;
    let blocks=[],mv=0,dir=1,sp=118,hp=3,bh=0,G=null,over=0;
    function geom(){
      const f=playBand();bh=Math.min(38,(f.h-80)/(need+1));
      G={x:(W-Math.min(W*.72,300))/2,w:Math.min(W*.72,300)};
      if(!blocks.length){
        blocks=[{x:W/2-70,w:140,c:PAL[1]}];mv=blocks[0].x;
      }
    }
    geom();
    function top(){return blocks[blocks.length-1];}
    function yOf(i){const f=playBand();return f.y+f.h-30-(i+1)*bh;}
    return {
      gk:'stack',onResize:geom,
      update(dt){
        if(cur!==this||finished)return;
        if(over>0){over-=dt;return;}
        mv+=dir*sp*dt;
        const t=top();
        if(mv<G.x-30||mv+120>G.x+G.w+30)dir*=-1;
      },
      draw(){
        const f=playBand();
        candyRect(G.x-14,f.y+f.h-26,G.w+28,20,10,'#DCE8F7',true);
        for(let i=0;i<blocks.length;i++){
          const b=blocks[i];
          candyRect(b.x,yOf(i),b.w,bh-3,6,b.c);
          g.fillStyle='rgba(255,255,255,.22)';rrect(b.x+4,yOf(i)+3,b.w-8,4,2);g.fill();
        }
        const t=top();
        candyRect(mv,yOf(blocks.length),120,bh-3,6,PAL[blocks.length%9]);
        if(over>0){g.globalAlpha=.5;g.fillStyle='#FF5D5D';rrect(mv,yOf(blocks.length),120,bh-3,6);g.fill();g.globalAlpha=1;}
        lbl(blocks.length-1+' / '+need,W/2,f.y+16,14,'#61739A');
      },
      tap(x,y){
        if(over>0)return;
        const t=top(),w=120;
        const ov=Math.min(mv+w,t.x+t.w)-Math.max(mv,t.x);
        if(ov<=8){
          hp--;buzz();shake=1;over=.45;
          if(hp<=0){fail('Missed the tower');return;}
          mvX=mv;return;
        }
        const nx=Math.max(mv,t.x),nw=ov;
        blocks.push({x:nx,w:nw,c:PAL[blocks.length%9]});
        popSound();burst(nx+nw/2,yOf(blocks.length-1),PAL[blocks.length%9],10);
        sp=Math.min(320,sp*1.09);
        mv=nx;
        if(blocks.length-1>=need){win(hp===3?3:hp===2?2:1);return;}
      },
      hud(){return 'height '+(blocks.length-1)+'/'+need+'   '+hearts(hp);},
      summary(){return 'stacked <b>'+need+'</b> blocks';}
    };
  }});

def('glint',{name:'GLINT',icon:'✨',c:'#FFD75E',

    }

      gk:'glint',onResize:geom,

      gk:'chase',onResize:geom,

        if(time<=0){hp--;buzz();shake=1;time=26;if(hp<=0){fail('It got away');return;}}

        candyRect(f.x,f.y,f.w,f.h,22,'#F0F7E6',true);
        lbl('round '+(round+1)+'/'+total,W/2,b.y+26,13,'#61739A');
        for(let i=0;i<r.length;i++){
          const p=r[i];
          shadowEll(p.x,f.y+f.h-8,p.rad*.9);
          candyCircle(p.x,p.y,p.rad,p.done?'#D9E8CC':PAL[(p.rank+2)%9]);
          if(p.done)lbl('✓',p.x,p.y,p.rad*.85,'#6E8A5A');
          if(i===bad&&badT>0){g.strokeStyle='#FF5D5D';g.lineWidth=5;g.beginPath();g.arc(p.x,p.y,p.rad+6,0,7);g.stroke();}
        }
      },
      tap(x,y){
        for(let i=r.length-1;i>=0;i--){const p=r[i];
          if(Math.hypot(x-p.x,y-p.y)>p.rad+8)continue;
          if(p.done)return;
          const small=r.filter(q=>!q.done).sort((a,c)=>a.rad-c.rad)[0];
          if(p===small){
            p.done=true;next++;ding(next);burst(p.x,p.y,'#9BE564',12);
            if(next>=n){
              round++;time=limit;
              if(round>=total){win(hp===3?3:hp===2?2:1);return;}
              n=Math.min(7,n+1);chime();geom();
            }
          }else{bad=i;badT=.5;hp--;buzz();shake=.8;if(hp<=0)fail('Wrong order');}
          return;
        }
      },
      hud(){return 'round '+(round+1)+'/'+total+'   '+hearts(hp);},
      summary(){return 'sorted <b>'+total+'</b> crowds';}
    };
  }});

def('sum',{name:'SUM',icon:'➕',c:'#3FA9FF',
  rule:'Two tiles must add up to the number in the badge. Clear six pairs.',
  make(){
    const dim=5,need=6,limit=42;
    let G=null,v=[],target=0,picked=-1,found=0,hp=3,time=limit,bad=-1,badT=0;
    function geom(){G=cellGeom(dim,dim,.8,380);}
    function deal(){
      v=[];for(let i=0;i<dim*dim;i++)v.push(1+Math.floor(Math.random()*9));
      target=8+Math.floor(Math.random()*8);
      if(!v.some((a,i)=>v.some((b,j)=>i!==j&&a!==0&&a+b===target))){v[0]=1;v[1]=target-1;}
      picked=-1;bad=-1;
    }
    geom();deal();
    return {
      gk:'sum',onResize:geom,
      update(dt){
        if(cur!==this||finished)return;
        if(badT>0)badT-=dt;
        time-=dt;
        if(time<=0){hp--;buzz();shake=1;time=limit;
          if(hp<=0){fail('Time ran out');return;}deal();}
      },
      draw(){
        timerBar(Math.max(0,time/limit));
        candyRect(W/2-64,playBand().y+34,128,32,13,'#3FA9FF');
        lbl('target '+target,W/2,playBand().y+50,14,'#fff');
        for(let i=0;i<v.length;i++){
          const p=cellAt(G,i),gone=v[i]===0;
          candyRect(p.x,p.y,G.cw,G.ch,G.cw*.22,gone?'#EDF3FC':(i===picked?'#FFC531':(i===bad&&badT>0?'#FF5D5D':'#DCE8F7')));
          if(!gone)lbl(String(v[i]),p.x+G.cw/2,p.y+G.ch/2,G.cw*.4,i===picked?'#fff':'#22304F');
        }
      },
      tap(x,y){
        const i=findCell(G,x,y);if(i<0||v[i]===0)return;
        if(picked<0){picked=i;blip(620);return;}
        if(picked===i){picked=-1;return;}
        if(v[picked]+v[i]===target){
          burst(x,y,'#FFC531',16);popSound();found++;
          v[picked]=0;v[i]=0;picked=-1;
          time=Math.min(limit,time+3);
          if(found>=need){win(time>21?3:time>9?2:1);return;}
          if(!v.some((a,p)=>a&&v.some((b,q)=>p<q&&a&&b&&a+b===target)))deal();
        }else{
          bad=i;badT=.5;hp--;buzz();shake=.8;picked=-1;
          if(hp<=0){fail('Not that pair');return;}
        }
      },
      hud(){return 'pairs '+found+'/'+need+'   '+hearts(hp);},
      summary(){return 'made <b>'+need+'</b> sums';}
    };
  }});

def('ivory',{name:'IVORY',icon:'🎹',c:'#5B6C8E',
  rule:'Dark keys climb the piano. Tap each one while it crosses the golden line.',
  make(){
    const need=16;
    let G=null,notes=[],sp=92,hp=3,hit=0,zone=0,spawn=.5,flash=[0,0,0,0];
    function geom(){
      const b=playBand(),w=Math.min(W*.84,380),h=Math.min(b.h-50,w*1.3);
      G={x:(W-w)/2,y:b.y+26,w,h,col:w/4};
      zone=G.y+G.h-Math.min(76,G.h*.18);
    }
    geom();
    return {
      gk:'ivory',onResize:geom,
      update(dt){
        if(cur!==this||finished)return;
        spawn-=dt;
        if(spawn<=0){spawn=Math.max(.32,.7-hit*.022);
          notes.push({c:Math.floor(Math.random()*4),y:G.y+G.h+28});}
        for(let i=notes.length-1;i>=0;i--){
          const n=notes[i];n.y-=sp*dt;
          if(n.y<G.y-6){notes.splice(i,1);hp--;buzz();shake=.6;
            if(hp<=0){fail('A key slipped past');return;}}
        }
        for(let i=0;i<4;i++)flash[i]*=.86;
      },
      draw(){
        candyRect(G.x,G.y,G.w,G.h,18,'#F4FAFF',true);
        g.strokeStyle='rgba(91,108,142,.18)';g.lineWidth=2;
        for(let i=1;i<4;i++){g.beginPath();g.moveTo(G.x+i*G.col,G.y+8);g.lineTo(G.x+i*G.col,G.y+G.h-8);g.stroke();}
        g.save();rrect(G.x,G.y,G.w,G.h,18);g.clip();
        g.fillStyle='rgba(255,197,49,.18)';g.fillRect(G.x,zone-25,G.w,50);
        g.strokeStyle='#FFC531';g.lineWidth=3;g.setLineDash([8,8]);
        g.beginPath();g.moveTo(G.x,zone-25);g.lineTo(G.x+G.w,zone-25);
        g.moveTo(G.x,zone+25);g.lineTo(G.x+G.w,zone+25);g.stroke();g.setLineDash([]);
        for(const n of notes){
          const x=G.x+n.c*G.col+4,w2=G.col-8;
          candyRect(x,n.y-18,w2,36,10,'#22304F');
          g.fillStyle='rgba(255,255,255,.16)';rrect(x+4,n.y-14,w2-8,7,4);g.fill();
        }
        g.restore();
        for(let i=0;i<4;i++)if(flash[i]>.02){
          g.fillStyle='rgba(63,169,255,'+flash[i]*.5+')';
          g.fillRect(G.x+i*G.col,zone-25,G.col,50);
        }
        lbl(hit+' / '+need+'   '+hearts(hp),W/2,playBand().y+12,14,'#61739A');
      },
      tap(x,y){
        if(x<G.x||x>G.x+G.w)return;
        const c=Math.min(3,Math.max(0,Math.floor((x-G.x)/G.col)));
        let bi=-1,bd=1e9;
        for(let i=0;i<notes.length;i++){const n=notes[i];
          if(n.c!==c)continue;const d=Math.abs(n.y-zone);if(d<bd){bd=d;bi=i;}}
        if(bi<0||bd>40){flash[c]=.4;blip(220);return;}
        notes.splice(bi,1);
        flash[c]=1;hit++;popSound();burst(G.x+c*G.col+G.col/2,zone,'#3FA9FF',12);
        sp=Math.min(200,sp*1.04);
        if(hit>=need)win(hp===3?3:hp===2?2:1);
      },
      hud(){return 'keys '+hit+'/'+need+'   '+hearts(hp);},
      summary(){return 'played <b>'+need+'</b> keys';}
    };
  }});

def('hex',{name:'HEX',icon:'💡',c:'#FFD75E',
  rule:'A tap flips a lamp and its four neighbours. Switch the whole board off.',
  tools:{hint:true},
  make(){
    const dim=4;
    let G=null,on=[],moves=0,budget=12,goal=0,solution=[];
    function geom(){G=cellGeom(dim,dim,.76,340);}
    function flip(i,arr){
      arr=arr||on;
      const c=i%dim,r=Math.floor(i/dim);
      const ks=[i];
      if(c>0)ks.push(i-1);if(c<dim-1)ks.push(i+1);
      if(r>0)ks.push(i-dim);if(r<dim-1)ks.push(i+dim);
      for(const k of ks)arr[k]^=1;
    }
    function fresh(){
      on=[];for(let i=0;i<dim*dim;i++)on.push(0);
      goal=3+Math.floor(Math.random()*3);moves=0;solution=[];
      const pool=shuf([...Array(dim*dim).keys()]).slice(0,goal);
      for(const i of pool){flip(i);solution.push(i);}
      budget=goal+3;
    }
    geom();fresh();
    function lit(){let n=0;for(const v of on)n+=v;return n;}
    return {
      gk:'hex',onResize:geom,
      update(){},
      draw(){
        for(let i=0;i<on.length;i++){
          const p=cellAt(G,i),l=on[i];
          candyRect(p.x,p.y,G.cw,G.ch,G.cw*.24,l?'#FFD75E':'#C6D8EE');
          if(l){soft(p.x+G.cw/2,p.y+G.ch/2,G.cw*.6,'rgba(255,255,255,.5)');
            lbl('✦',p.x+G.cw/2,p.y+G.ch/2,G.cw*.42,'#fff');}
        }
        lbl(lit()+' lit · '+Math.max(0,budget-moves)+' taps left',W/2,playBand().y+16,14,'#61739A');
      },
      tap(x,y){
        const i=findCell(G,x,y);if(i<0)return;
        flip(i);moves++;blip(520+moves*12);
        if(!lit()){win(moves<=goal?3:moves<=budget-2?2:1);return;}
        if(moves>=budget){fail('Out of taps');}
      },
      hint(){const i=solution.find(s=>on[s]);if(i==null){toast('Already dark');return;}
        const p=cellAt(G,i);g.fillStyle='rgba(255,138,61,.35)';
        rrect(p.x,p.y,G.cw,G.ch,G.cw*.24);g.fill();toast('Try a lit lamp');},
      hud(){return lit()+' lit · moves '+moves+'/'+budget;},
      dbg(){return {on:on.slice(),goal,budget,solution:solution.slice()};},
      summary(){return 'doused <b>'+goal+'</b> lamps in '+moves+' taps';}
    };
  }});

def('shadow',{name:'SHADOW',icon:'🌑',c:'#61739A',
  rule:'Four blobs on the board. Only one has exactly the same silhouette.',
  make(){
    const dim=4,need=4,limit=34;
    let shape=[],opts=[],round=0,hp=3,time=limit,bad=-1,badT=0,lay=null;
    function grow(k){
      const s=[Math.floor(Math.random()*dim*dim)];
      let guard=0;
      while(s.length<k&&guard++<200){
        const i=s[Math.floor(Math.random()*s.length)],c=i%dim,r=Math.floor(i/dim);
        const ns=[];
        if(c>0)ns.push(i-1);if(c<dim-1)ns.push(i+1);
        if(r>0)ns.push(i-dim);if(r<dim-1)ns.push(i+dim);
        const free=shuf(ns).filter(n=>s.indexOf(n)<0);
        if(free.length)s.push(free[0]);
      }
      return s;
    }
    function mutate(s){
      const t=s.slice(),at=Math.floor(Math.random()*t.length),i=t[at];
      const c=i%dim,r=Math.floor(i/dim),ns=[];
      if(c>0)ns.push(i-1);if(c<dim-1)ns.push(i+1);if(r>0)ns.push(i-dim);if(r<dim-1)ns.push(i+dim);
      const free=ns.filter(n=>t.indexOf(n)<0);
      t.splice(at,1);
      if(free.length)t.push(free[Math.floor(Math.random()*free.length)]);
      return t;
    }
    function key(a){return a.slice().sort((x,y)=>x-y).join();}
    function fresh(){
      shape=grow(5+Math.min(2,round));
      opts=[shape.slice()];let guard=0;
      while(opts.length<4&&guard++<200){
        const m=mutate(opts[opts.length-1]);
        if(key(m)!==key(shape)&&!opts.some(o=>key(o)===key(m)))opts.push(m);
      }
      while(opts.length<4)opts.push(shape.slice().concat([(shape[0]+dim)%16]));
      shuf(opts);bad=-1;
    }
    function geom(){
      const b=playBand();
      const cs=Math.min(26,(W*.86-40)/8),gap=Math.max(4,cs*.14);
      const bw=dim*cs+(dim-1)*gap;
      const top=b.y+34;
      lay={cs,gap,bw,ref:{x:(W-bw)/2,y:top},
        pan:[0,1,2,3].map(k=>({x:W/2+(k%2?1:-1)*(bw/2+12)-bw/2,y:top+bw+26+(k<2?0:bw+18)}))};
      fresh();
    }
    geom();
    function paint(cells,x,y,cs,gap,fill){
      for(const i of cells){
        const c=i%dim,r=Math.floor(i/dim);
        candyRect(x+c*(cs+gap),y+r*(cs+gap),cs,cs,cs*.24,fill);
      }
    }
    return {
      gk:'shadow',onResize:geom,
      update(dt){
        if(cur!==this||finished)return;
        if(badT>0)badT-=dt;
        time-=dt;if(time<=0){hp--;buzz();shake=1;time=limit;
          if(hp<=0){fail('Too slow');return;}fresh();}
      },
      draw(){
        timerBar(Math.max(0,time/limit),playBand().y+8);
        lbl('round '+(round+1)+'/'+need,W/2,playBand().y+24,12,'#9AAAC8');
        paint(shape,lay.ref.x,lay.ref.y,lay.cs,lay.gap,'#22304F');
        for(let k=0;k<4;k++){
          const p=lay.pan[k],isB=k===bad&&badT>0;
          candyRect(p.x-6,p.y-6,lay.bw+12,lay.bw+12,14,isB?'#FF5D5D':'#E7EEF9');
          paint(opts[k],p.x,p.y,lay.cs,lay.gap,isB?'#fff':'#61739A');
        }
      },
      tap(x,y){
        for(let k=0;k<4;k++){
          const p=lay.pan[k];
          if(x>=p.x-6&&x<=p.x+lay.bw+6&&y>=p.y-6&&y<=p.y+lay.bw+6){
            if(key(opts[k])===key(shape)){
              round++;popSound();burst(x,y,'#61739A',16);time=Math.min(limit,time+7);
              if(round>=need){win(hp===3?3:hp===2?2:1);return;}
              fresh();
            }else{bad=k;badT=.5;hp--;buzz();shake=.8;if(hp<=0)fail('Wrong silhouette');}
            return;
          }
        }
      },
      hud(){return 'found '+round+'/'+need+'   '+hearts(hp);},
      summary(){return 'matched <b>'+need+'</b> silhouettes';}
    };
  }});

def('sweep',{name:'SWEEP',icon:'🧹',c:'#22D3C5',
  rule:'Drag the broom over every stain. Keep moving until the floor is spotless.',
  make(){
    const dim=5,limit=30;
    let G=null,dirt=[],time=limit,total=0,tx=0,ty=0,bx=0,by=0,cleaned=0;
    function geom(){G=cellGeom(dim,dim,.8,380);}
    function fresh(){
      dirt=[];for(let i=0;i<dim*dim;i++)dirt.push(0);
      total=10;cleaned=0;
      for(const i of shuf([...Array(dim*dim).keys()]).slice(0,total))dirt[i]=1;
    }
    geom();fresh();
    function left(){let n=0;for(const d of dirt)n+=d;return n;}
    function scrub(x,y){
      const i=findCell(G,x,y);
      if(i>=0&&dirt[i]){dirt[i]=0;cleaned++;popSound();burst(x,y,'#8B5E34',9);
        if(!left()){win(time>15?3:time>6?2:1);}}
    }
    return {
      gk:'sweep',onResize:geom,
      update(dt){
        if(cur!==this||finished)return;
        time-=dt;
        bx+=(tx-bx)*.35;by+=(ty-by)*.35;
        if(time<=0)fail('Left a mess');
      },
      draw(){
        timerBar(Math.max(0,time/limit),playBand().y+8);
        for(let i=0;i<dim*dim;i++){
          const p=cellAt(G,i);
          candyRect(p.x,p.y,G.cw,G.ch,10,i%2?'#F6FBFF':'#EAF4FB');
          if(dirt[i]){
            const m=cellMid(G,i);
            g.fillStyle='rgba(139,94,52,.5)';
            g.beginPath();g.ellipse(m.x,m.y,G.cw*.28,G.cw*.2,.4,0,7);g.fill();
            g.fillStyle='rgba(139,94,52,.28)';
            g.beginPath();g.arc(m.x+G.cw*.2,m.y-G.cw*.16,G.cw*.1,0,7);g.fill();
          }
        }
        const r=G.cw*.5;
        g.save();g.translate(bx,by);g.rotate(-.45);
        g.strokeStyle='#8B5E34';g.lineWidth=6;g.lineCap='round';
        g.beginPath();g.moveTo(0,0);g.lineTo(0,-r*2);g.stroke();
        candyRect(-r*.72,-r*.15,r*1.44,r*.5,7,'#FFC531');
        g.strokeStyle='#C97F00';g.lineWidth=2;
        for(let k=0;k<6;k++){const xx=-r*.6+k*r*.24;
          g.beginPath();g.moveTo(xx,r*.34);g.lineTo(xx,r*.66);g.stroke();}
        g.restore();
      },
      hold(x,y,down){tx=x;ty=y;if(!down)return;if(!bx){bx=x;by=y;}scrub(x,y);},
      move(x,y){tx=x;ty=y;scrub(x,y);},
      hud(){return 'stains '+cleaned+'/'+total+'   '+Math.ceil(Math.max(0,time))+'s';},
      summary(){return 'swept up <b>'+total+'</b> stains';}
    };
  }});

def('match',{name:'MATCH',icon:'🃏',c:'#A777FF',
  rule:'Flip two cards at a time. Remember the faces and pair them all.',
  tools:{},
  make(){
    const cols=4,rows=3,limit=70;
    const FACE=['🍎','🍋','🌙','⭐','🍄','🔔'];
    let G=null,deck=[],open=[],done=[],moves=0,time=limit,lockT=0;
    function geom(){G=cellGeom(cols,rows,.84,420);}
    function fresh(){
      const ids=[];for(let i=0;i<6;i++){ids.push(i,i);}
      deck=shuf(ids);open=[];done=[];moves=0;
    }
    geom();fresh();
    return {
      gk:'match',onResize:geom,
      update(dt){
        if(cur!==this||finished)return;
        time-=dt;
        if(lockT>0){lockT-=dt;if(lockT<=0)open=[];}
        if(time<=0)fail('Cards stayed hidden');
      },
      draw(){
        timerBar(Math.max(0,time/limit),playBand().y+8);
        for(let i=0;i<deck.length;i++){
          const p=cellAt(G,i),up=open.indexOf(i)>=0||done.indexOf(i)>=0;
          candyRect(p.x,p.y,G.cw,G.ch*.9,G.cw*.2,up?'#F4FAFF':'#A777FF');

          else lbl('?',p.x+G.cw/2,p.y+G.ch*.45,G.cw*.4,'rgba(255,255,255,.8)');
          if(done.indexOf(i)>=0){g.strokeStyle='#43D67C';g.lineWidth=4;rrect(p.x,p.y,G.cw,G.ch*.9,G.cw*.2);g.stroke();}
        }
        lbl('flips '+moves,W/2,playBand().y+22,13,'#61739A');
      },
      tap(x,y){
        const i=findCell(G,x,y);
        if(i<0||done.indexOf(i)>=0||open.indexOf(i)>=0||lockT>0)return;
        open.push(i);blip(560+i*20);
        if(open.length===2){
          moves++;
          if(deck[open[0]]===deck[open[1]]){
            done.push(open[0],open[1]);chime();
            const a=cellMid(G,open[0]),b=cellMid(G,open[1]);
            burst(a.x,a.y,'#A777FF',12);burst(b.x,b.y,'#A777FF',12);
            open=[];
            if(done.length===deck.length){
              const eff=moves<=9?3:moves<=12?2:1;
              win(eff);

        }
      },
      hud(){return 'pairs '+done.length/2+'/6 · flips '+moves;},
      summary(){return 'matched all six pairs in <b>'+moves+'</b> flips';}
    };
  }});

def('dodge',{name:'DODGE',icon:'💣',c:'#FF5D5D',

def('mine',{name:'MINE',icon:'🚩',c:'#FF8A3D',
  rule:'Numbers count the mines touching that tile. Reveal every safe tile.',
  tools:{hint:true},
  make(){
    const dim=5,mn=4;
    let G=null,mine=[],rev=[],nums=[],hp=3,first=true,flag=[];
    function geom(){G=cellGeom(dim,dim,.78,360);}
    function fresh(){
      mine=[];rev=[];nums=[];flag=[];first=true;
      for(let i=0;i<dim*dim;i++){mine.push(0);rev.push(0);nums.push(0);flag.push(0);}
      for(const i of shuf([...Array(dim*dim).keys()]).slice(0,mn))mine[i]=1;
      for(let i=0;i<dim*dim;i++){
        let n=0;const c=i%dim,r=Math.floor(i/dim);
        for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
          const rr=r+dr,cc=c+dc;
          if(rr>=0&&rr<dim&&cc>=0&&cc<dim&&mine[rr*dim+cc])n++;
        }
        nums[i]=n;
      }
    }
    geom();fresh();
    function reveal(i){
      if(rev[i]||flag[i])return 0;
      rev[i]=1;
      let n=1;
      if(!nums[i]){
        const c=i%dim,r=Math.floor(i/dim);
        for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
          const rr=r+dr,cc=c+dc;
          if(rr>=0&&rr<dim&&cc>=0&&cc<dim&&!(dr||dc))n+=reveal(rr*dim+cc);
        }
      }
      return n;
    }
    function safeLeft(){let n=0;for(let i=0;i<dim*dim;i++)if(!mine[i]&&!rev[i])n++;return n;}
    return {
      gk:'mine',onResize:geom,
      update(){},
      draw(){
        for(let i=0;i<dim*dim;i++){
          const p=cellAt(G,i),c=nums[i];
          if(rev[i]){
            candyRect(p.x,p.y,G.cw,G.ch,G.cw*.2,'#EFF5FE',true);
            if(c)lbl(String(c),p.x+G.cw/2,p.y+G.ch/2,G.cw*.38,
              ['#22AF5F','#3FA9FF','#FF5D5D','#A777FF','#8B5E34','#22304F','#FF8A3D','#22304F'][c-1]||'#22304F');
          }else{
            candyRect(p.x,p.y,G.cw,G.ch,G.cw*.2,flag[i]?'#FF8A3D':'#C6D8EE');
            if(flag[i])lbl('⚑',p.x+G.cw/2,p.y+G.ch/2,G.cw*.38,'#fff');
          }
          if(rev[i]&&mine[i]){lbl('✸',p.x+G.cw/2,p.y+G.ch/2,G.cw*.44,'#FF5D5D');}
        }
        lbl(safeLeft()+' safe tiles to find · '+hearts(hp),W/2,playBand().y+16,14,'#61739A');
      },
      tap(x,y){
        const i=findCell(G,x,y);if(i<0||rev[i])return;
        if(first){first=false;if(mine[i]){moveMine(i);}}
        if(mine[i]){
          rev[i]=1;hp--;buzz();shake=1;burst(x,y,'#FF5D5D',20);
          if(hp<=0){fail('Mined');return;}
          return;
        }
        reveal(i);ding(3);blip(700);
        if(!safeLeft()){win(hp===3?3:hp===2?2:1);}
      },
      hint(){
        for(let i=0;i<dim*dim;i++)if(!mine[i]&&!rev[i]){flag[i]=1;toast('One safe tile is marked');blip(880);return;}
      },
      hud(){return 'safe left '+safeLeft()+'   '+hearts(hp);},
      summary(){return 'swept a '+dim+'×'+dim+' field with '+mn+' mines';}
    };
    function nbrs(i){
      const c=i%dim,r=Math.floor(i/dim),o=[];
      for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
        const rr=r+dr,cc=c+dc;
        if(dr||dc)if(rr>=0&&rr<dim&&cc>=0&&cc<dim)o.push(rr*dim+cc);
      }
      return o;
    }
    function recount(){
      for(let i=0;i<dim*dim;i++){
        let n=0;for(const k of nbrs(i))if(mine[k])n++;nums[i]=n;
      }
    }
    function moveMine(i){
      const bad=[i].concat(nbrs(i));
      const pool=[];for(let k=0;k<dim*dim;k++)if(bad.indexOf(k)<0&&!mine[k])pool.push(k);
      if(!pool.length)return;
      mine[i]=0;mine[pool[Math.floor(Math.random()*pool.length)]]=1;recount();
    }
  }});

def('bloom',{name:'BLOOM',icon:'🌸',c:'#FF6FC2',
  rule:'Tap a cluster of three or more matching buds. They fall and the rest drop down.',
  make(){
    const cols=6,rows=6,nc=5,left=8;
    let G=null,v=[],score=0,pops=0;
    function geom(){G=cellGeom(cols,rows,.86,420);}
    function fresh(){
      v=[];for(let i=0;i<cols*rows;i++)v.push(Math.floor(Math.random()*nc));
      score=0;pops=0;
    }
    geom();fresh();
    function group(i){
      const c0=v[i];if(c0<0)return [];
      const seen=[i],out=[i];
      while(seen.length){
        const k=seen.pop(),c=k%cols,r=Math.floor(k/cols);
        const ns=[];
        if(c>0)ns.push(k-1);if(c<cols-1)ns.push(k+1);
        if(r>0)ns.push(k-cols);if(r<rows-1)ns.push(k+cols);
        for(const n of ns)if(v[n]===c0&&out.indexOf(n)<0){out.push(n);seen.push(n);}
      }
      return out;
    }
    function drop(){
      for(let c=0;c<cols;c++){
        const col=[];
        for(let r=rows-1;r>=0;r--)if(v[r*cols+c]>=0)col.push(v[r*cols+c]);
        let k=0;
        for(let r=rows-1;r>=0;r--){v[r*cols+c]=k<col.length?col[k++]:-1;}
      }
    }
    function alive(){let n=0;for(const x of v)if(x>=0)n++;return n;}
    function anyMove(){
      for(let i=0;i<v.length;i++)if(v[i]>=0&&group(i).length>=3)return true;
      return false;
    }
    return {
      gk:'bloom',onResize:geom,
      update(){},
      draw(){
        const b=playBand();
        for(let i=0;i<v.length;i++){
          if(v[i]<0)continue;
          const c=i%cols;
          const p={x:G.x+c*(G.cw+G.gap),y:G.y+Math.floor(i/cols)*(G.ch+G.gap)};
          candyCircle(p.x+G.cw/2,p.y+G.ch/2,G.cw*.4,PAL[v[i]]);
          g.fillStyle='rgba(255,255,255,.5)';
          g.beginPath();g.arc(p.x+G.cw*.36,p.y+G.ch*.34,G.cw*.1,0,7);g.fill();
        }
        candyRect(W/2-74,b.y+4,148,34,14,'#FF6FC2');
        lbl(alive()+' left · '+score+' buds',W/2,b.y+21,13,'#fff');
      },
      tap(x,y){
        const i=findCell(G,x,y);if(i<0||v[i]<0)return;
        const g2=group(i);
        if(g2.length<3){buzz();shake=.4;return;}
        for(const k of g2){const p=cellMid(G,k);burst(p.x,p.y,PAL[v[k]],7);v[k]=-1;}
        score+=g2.length;
        popSound();
        drop();pops++;
        if(alive()<=left){win(score>=60?3:score>=48?2:1);return;}
        if(!anyMove()){fresh();toast('No moves — new garden');}
      },
      hud(){return 'cleared '+score+' · '+alive()+' left';},
      summary(){return 'popped <b>'+score+'</b> buds in '+pops+' clusters';}
    };
  }});

def('wire',{name:'WIRE',icon:'🔌',c:'#22D3C5',
  rule:'Every tap spins a tile a quarter turn. Join the inlet ring to the outlet ring.',
  tools:{hint:true},
  make(){
    const cols=4,rows=3,N=1,E=2,S=4,W=8;
    let G=null,m=[],sr=0,sol=0;
    function geom(){G=cellGeom(cols,rows,.84,430);}
    function rot90(k){return ((k<<1)&15)|(k>>3);}
    function gen(){
      let guard=0;
      while(guard++<40){
        sr=Math.floor(Math.random()*rows);sol=Math.floor(Math.random()*rows);
        const p=[[0,sr]];let r=sr;
        for(let c=0;c<cols;c++){
          const rt=c===cols-1?sol:Math.floor(Math.random()*rows);
          while(r!==rt){const d=Math.sign(rt-r);r+=d;p.push([c,r]);}
          if(c<cols-1)p.push([c+1,r]);
        }
        m=[];for(let i=0;i<cols*rows;i++)m.push(0);
        for(let k=0;k<p.length;k++){
          const i=p[k][1]*cols+p[k][0];
          let mask=k===0?W:0;
          if(k>0){const a=p[k-1],b=p[k];
            mask|=a[0]<b[0]?W:a[0]>b[0]?E:a[1]<b[1]?N:S;}
          if(k<p.length-1){const a=p[k],b=p[k+1];
            mask|=a[0]<b[0]?E:a[0]>b[0]?W:a[1]<b[1]?S:N;}
          else mask|=E;
          m[i]=mask;
        }
        for(let i=0;i<m.length;i++)if(!m[i])m[i]=[N|E,E|S,S|W,W|N,N|S,E|W][Math.floor(Math.random()*6)];
        for(let i=0;i<m.length;i++){const n=1+Math.floor(Math.random()*3);for(let k=0;k<n;k++)m[i]=rot90(m[i]);}
        if(!isLive())break;
      }
    }
    function isLive(){
      const seen={};
      if(!(m[sr*cols]&W))return false;
      seen[0+','+sr]=1;const q=[[0,sr]];
      while(q.length){
        const cr=q.shift(),c=cr[0],r=cr[1],mask=m[r*cols+c];
        const step=(nc,nr,need,opp)=>{
          if(nc<0||nc>=cols||nr<0||nr>=rows||seen[nc+','+nr])return;
          if((mask&need)&&(m[nr*cols+nc]&opp)){seen[nc+','+nr]=1;q.push([nc,nr]);}
        };
        step(c,r-1,N,S);step(c,r+1,S,N);step(c-1,r,W,E);step(c+1,r,E,W);
      }
      return !!seen[(cols-1)+','+sol]&&(m[sol*cols+cols-1]&E);
    }
    function liveSet(){
      const seen={};
      if(!(m[sr*cols]&W))return seen;
      seen[0+','+sr]=1;const q=[[0,sr]];
      while(q.length){
        const cr=q.shift(),c=cr[0],r=cr[1],mask=m[r*cols+c];
        const step=(nc,nr,need,opp)=>{
          if(nc<0||nc>=cols||nr<0||nr>=rows||seen[nc+','+nr])return;
          if((mask&need)&&(m[nr*cols+nc]&opp)){seen[nc+','+nr]=1;q.push([nc,nr]);}
        };
        step(c,r-1,N,S);step(c,r+1,S,N);step(c-1,r,W,E);step(c+1,r,E,W);
      }
      return seen;
    }
    geom();gen();
    return {
      gk:'wire',onResize:geom,
      update(){},
      draw(){
        const l=liveSet(),b=playBand(),lw=Math.max(7,G.cw*.17);
        for(let i=0;i<cols*rows;i++){
          const p=cellAt(G,i);
          candyRect(p.x,p.y,G.cw,G.ch,G.cw*.16,'#EAF1FA');
        }
        for(let i=0;i<cols*rows;i++){
          const c=i%cols,r=Math.floor(i/cols),mask=m[i];
          const p=cellAt(G,i),cx=p.x+G.cw/2,cy=p.y+G.ch/2;
          const col=l[c+','+r]?'#22D3C5':'#B6C7DE';
          g.strokeStyle=col;g.lineWidth=lw;g.lineCap='round';
          if(mask&W){g.beginPath();g.moveTo(cx,cy);g.lineTo(p.x,cy);g.stroke();}
          if(mask&E){g.beginPath();g.moveTo(cx,cy);g.lineTo(p.x+G.cw,cy);g.stroke();}
          if(mask&N){g.beginPath();g.moveTo(cx,cy);g.lineTo(cx,p.y);g.stroke();}
          if(mask&S){g.beginPath();g.moveTo(cx,cy);g.lineTo(cx,p.y+G.ch);g.stroke();}
          g.fillStyle=col;g.beginPath();g.arc(cx,cy,lw*.5,0,7);g.fill();
        }
        const pr=cellAt(G,sr*cols),po=cellAt(G,sol*cols+cols-1);
        candyCircle(pr.x-2,pr.y+G.ch/2,12,'#FF8A3D');
        candyCircle(po.x+G.cw+2,po.y+G.ch/2,12,isLive()?'#43D67C':'#FF8A3D');
        lbl(isLive()?'water is through':'link orange ring to orange ring',W/2,b.y+18,14,'#61739A');
      },
      tap(x,y){
        const i=findCell(G,x,y);if(i<0)return;
        m[i]=rot90(m[i]);blip(340+(i%cols)*50);
        if(isLive()){win(3);burst(x,y,'#22D3C5',22);}
      },
      hint(){toast('Water enters at the left ring');blip(880);},
      hud(){return 'inlet row '+(sr+1)+' · outlet row '+(sol+1);},
      dbg(){return {m:m.slice(),sr,sol,cols,rows,solved:isLive()};},
      summary(){return 'joined the pipe';}
    };
  }});

def('tilt',{name:'TILT',icon:'⚖️',c:'#8B5E34',
  rule:'Hang every weight. The beam is level when both sides pull equally hard.',
  make(){
    const PAIRS=[[2,3,3,2],[4,3,6,2],[3,4,2,6],[6,1,3,2],[2,2,4,1],[4,2,2,4],[6,2,3,4],[5,2,2,5],[4,1,2,2]];
    let round=0,w=[],slot,cur=0,lay=null,tilt=0,tries=0;
    function geom(){
      const b=playBand();
      lay={cx:W/2,cy:b.y+b.h*.4,u:Math.min(W*.13,56),floor:b.y+b.h-18};
    }
    function fresh(){
      const picks=shuf(PAIRS.slice()).slice(0,2+(round>0?1:0));
      w=[];
      for(const p of picks){w.push({v:p[0]});w.push({v:p[2]});}
      shuf(w);slot=[];for(let i=0;i<6;i++)slot.push(-1);cur=0;
    }
    geom();fresh();
    function torque(){
      let t=0;
      for(let s=0;s<6;s++){
        if(slot[s]<0)continue;
        t+=(s<3?-1:1)*w[slot[s]].v*((s%3)+1);
      }
      return t;
    }
    return {
      gk:'tilt',onResize:geom,
      update(){
        if(cur!==this||finished)return;
        tilt+=((Math.max(-1,Math.min(1,torque()*.012)))-tilt)*.07;
      },
      draw(){
        const b=playBand(),cx=lay.cx,cy=lay.cy,u=lay.u;
        candyRect(cx-44,cy,88,lay.floor-cy,10,'#C9A227');
        g.save();g.translate(cx,cy);g.rotate(tilt*.3);
        candyRect(-u*3.7,-9,u*7.4,18,9,'#E0B84A');
        for(let s=0;s<6;s++){
          const side=s<3?-1:1,d=(s%3)+1,x=side*d*u,f=slot[s]>=0;
          candyRect(x-17,f?-52:-26,34,f?30:16,8,f?PAL[s%9]:'#C6D8EE');
          lbl(f?String(w[slot[s]].v):String(d),x,f?-37:-18,f?16:11,f?'#fff':'#61739A');
        }
        g.restore();
        candyCircle(cx,cy,9,'#8B5E34');
        lbl('round '+(round+1)+'/3',W/2,b.y+16,13,'#61739A');
        lbl('pull difference '+Math.abs(torque()),cx,cy-70,12,'#61739A');
        if(cur<w.length){
          candyCircle(cx,lay.floor-120,27,PAL[cur%9]);
          lbl(String(w[cur].v),cx,lay.floor-120,21,'#fff');
          lbl('tap an empty notch',cx,lay.floor-88,12,'#9AAAC8');
        }
      },
      tap(x,y){
        if(cur>=w.length)return;
        for(let s=0;s<6;s++){
          if(slot[s]>=0)continue;
          const side=s<3?-1:1,d=(s%3)+1,sx=lay.cx+side*d*lay.u;
          if(Math.abs(x-sx)<28&&y>lay.cy-62&&y<lay.cy+10){
            slot[s]=cur;cur++;popSound();burst(sx,lay.cy-38,PAL[s%9],8);blip(520+s*40);
            if(cur>=w.length){
              if(torque()===0){
                round++;chime();
                if(round>=3){win(tries===0?3:tries===1?2:1);return;}
                fresh();
              }else{
                tries++;buzz();shake=1;
                if(tries>=3){fail('Never balanced');return;}
                for(let k=0;k<6;k++)slot[k]=-1;cur=0;toast('Uneven — try again');
              }
            }
            return;
          }
        }
      },
      hud(){return 'weights '+cur+'/'+w.length+' · tries '+hearts(3-tries);},
      summary(){return 'levelled <b>3</b> beams';}
    };
  }});

      cup=[0,1,2];pea=Math.floor(Math.random()*3);
      swaps=[];const n=2+round;
      for(let i=0;i<n;i++){const a=Math.floor(Math.random()*3),bb=Math.floor(Math.random()*3);
        if(a!==bb)swaps.push([a,bb]);}
      si=0;phase='show';t=1.1;anim=null;
    }
    function slotOf(i){return cup[i];}
    function swap(a,b){
      let ia=-1,ib=-1;
      for(let i=0;i<3;i++){if(cup[i]===a)ia=i;if(cup[i]===b)ib=i;}
      if(ia<0||ib<0)return;
      const t2=cup[ia];cup[ia]=cup[ib];cup[ib]=t2;
    }
    geom();fresh();
    function x(i){return xs[cup[i]];}
    return {
      gk:'spy',onResize:geom,
      update(dt){
        if(cur!==this||finished)return;
        if(phase==='show'){t-=dt;if(t<=0){phase='shuffle';anim=null;si=0;}return;}
        if(phase!=='shuffle')return;
        if(anim){
          anim.t+=dt/.36;
          if(anim.t>=1){swap(anim.p[0],anim.p[1]);anim=null;}
          return;
        }
        if(si<swaps.length){anim={p:swaps[si++],t:0};return;}
        phase='pick';
      },
      draw(){
        const b=playBand();
        candyRect(W/2-130,py+pr*.5,260,14,7,'#C6D8EE');
        if(phase==='show')for(let i=0;i<3;i++)if(i===pea)candyCircle(x(i),py+pr*.62,pr*.2,'#43D67C');
        for(let i=0;i<3;i++){
          let px=x(i),pyy=py;
          if(anim&&cup[i]!==undefined){
            const a=anim.p[0],bb=anim.p[1];
            if(slotOf(i)===a||slotOf(i)===bb){
              const other=a===slotOf(i)?bb:a;
              const e=easeOut(Math.min(1,anim.t));
              px=xs[slotOf(i)]*(1-e)+xs[other]*e;
              pyy=py-Math.sin(Math.min(1,anim.t)*Math.PI)*pr*.5;
            }
          }
          g.save();
          const lg=g.createLinearGradient(px,pyy-pr,px,pyy+pr*.4);
          lg.addColorStop(0,'#C9A6FF');lg.addColorStop(1,'#8F5FEA');
          g.fillStyle=lg;g.beginPath();
          g.moveTo(px-pr,pyy+pr*.35);
          g.quadraticCurveTo(px-pr*1.02,pyy-pr*.85,px,pyy-pr*.92);
          g.quadraticCurveTo(px+pr*1.02,pyy-pr*.85,px+pr,pyy+pr*.35);
          g.closePath();g.fill();
          g.fillStyle='rgba(255,255,255,.3)';
          g.beginPath();g.ellipse(px-pr*.3,pyy-pr*.35,pr*.2,pr*.34,-.4,0,7);g.fill();
          g.fillStyle='#6E3FC4';rrect(px-pr,pyy+pr*.24,pr*2,pr*.2,pr*.1);g.fill();
          g.restore();
        }
        lbl(phase==='pick'?'lift one':phase==='show'?'memorise the pea':'shuffling…',
          W/2,b.y+18,15,'#61739A');
      },
      tap(xx,yy){
        if(phase!=='pick')return;
        if(yy<py-pr*2||yy>py+pr*2)return;
        let best=-1,bd=1e9;
        for(let i=0;i<3;i++){const d=Math.abs(xx-xs[i]);if(d<bd){bd=d;best=i;}}
        if(bd>pr*1.3)return;
        let cupAt=-1;
        for(let i=0;i<3;i++)if(cup[i]===best)cupAt=i;
        if(cupAt===pea){
          round++;chime();burst(xs[best],py,'#43D67C',20);
          if(round>=rounds){win(hp===3?3:hp===2?2:1);return;}
          fresh();
        }else{
          hp--;buzz();shake=1;
          if(hp<=0){fail('Lost the pea');return;}
          toast('Not that one');fresh();
        }
      },
      hud(){return 'find '+round+'/'+rounds+'   '+hearts(hp);},
      summary(){return 'tracked the pea <b>'+rounds+'</b> times';}
    };
  }});

          lbl(NAMES[i],q.x+q.w/2,q.y+q.h/2,i===4?13:14,'#fff');

        for(let i=0;i<5;i++){

          if(i===0)h=h<=1?12:h-1;
          if(i===1)h=h>=12?1:h+1;
          if(i===2)mi=(mi+45)%60;
          if(i===3)mi=(mi+15)%60;

            if(h===th&&mi===tm){round++;ok=1;chime();
              if(round>=need){win(3);return;}fresh();}
            else{ok=0;buzz();shake=.6;}
            return;
          }
          ok=0;blip(600+i*40);return;
        }
      },
      hud(){return 'hands '+h+':'+(mi<10?'0'+mi:mi)+'   '+round+'/'+need;},
      summary(){return 'set <b>'+need+'</b> clocks';}
    };
  }});

def('dig',{name:'DIG',icon:'🍎',c:'#FF5D5D',
  rule:'The fruit swings on its vine. Tap the vine to cut it into the moving basket.',
  make(){

      lay={ax:W/2,ay:b.y+16,L:Math.min(b.h*.4,180),by:b.y+b.h-46,hw:Math.min(W*.34,150)};

        if(cur!==this||finished)return;

          vy+=1400*dt;fx+=vx*dt;fy+=vy*dt;
          if(vy>0&&fy>lay.by-14&&fy<lay.by+26){

        bx+=bdir*(104+round*26)*dt;
        if(bx<lay.ax-lay.hw){bx=lay.ax-lay.hw;bdir=1;}

          candyCircle(lay.ax,lay.ay,7,'#8B5E34');
          candyCircle(p.x,p.y,17,'#FF5D5D');
          g.fillStyle='rgba(255,255,255,.4)';g.beginPath();g.arc(p.x-5,p.y-6,4,0,7);g.fill();
          g.strokeStyle='#8B5E34';g.lineWidth=3;
          g.beginPath();g.moveTo(p.x,p.y-16);g.lineTo(p.x+3,p.y-23);g.stroke();
        }else{
          candyCircle(fx,fy,17,'#FF5D5D');

        g.fillStyle='#8B5E34';g.beginPath();
        g.moveTo(-bw,-14);g.lineTo(bw,-14);g.lineTo(bw*.74,16);g.lineTo(-bw*.74,16);g.closePath();g.fill();
        g.fillStyle='rgba(255,255,255,.18)';g.fillRect(-bw,-14,bw*2,6);
        g.strokeStyle='#5E3E1F';g.lineWidth=3;
        g.beginPath();g.moveTo(-bw,-14);g.lineTo(bw,-14);g.stroke();

        lbl('caught '+round+'/'+need+'   '+hearts(hp),W/2,b.y+14,14,'#61739A');

def('fill',{name:'FILL',icon:'🎨',c:'#FF8A3D',
  rule:'Each tap repaints the big blob from the corner. Make the whole board one colour.',
  make(){
    const dim=7,nc=6;
    let G=null,v=[],moves=0,budget=22;
    function geom(){G=cellGeom(dim,dim,.82,320);sw();}
    function sw(){
      const b=playBand(),n=nc,ww=Math.min(W*.86,400),cw=(ww-(n-1)*8)/n;
      return {cw,ww,y:b.y+b.h-40,x0:W/2-ww/2};
    }
    function fresh(){
      v=[];for(let i=0;i<dim*dim;i++)v.push(Math.floor(Math.random()*nc));
      moves=0;
    }
    geom();fresh();
    function region(col){
      const start=v[0],seen=[0],out=[0];
      while(seen.length){
        const k=seen.pop(),c=k%dim,r=Math.floor(k/dim);
        const ns=[];
        if(c>0)ns.push(k-1);if(c<dim-1)ns.push(k+1);
        if(r>0)ns.push(k-dim);if(r<dim-1)ns.push(k+dim);
        for(const n of ns)if(v[n]===start&&out.indexOf(n)<0){out.push(n);seen.push(n);}
      }
      return out;
    }
    function done(){return region().length===v.length;}
    return {
      gk:'fill',onResize:geom,
      update(){},
      draw(){
        const b=playBand(),reg=region();
        for(let i=0;i<v.length;i++){
          const p=cellAt(G,i);
          candyRect(p.x,p.y,G.cw,G.ch,4,PAL[v[i]]);
          if(reg.indexOf(i)>=0){g.strokeStyle='rgba(255,255,255,.55)';g.lineWidth=2;
            rrect(p.x+1,p.y+1,G.cw-2,G.ch-2,4);g.stroke();}
        }
        const q=sw();
        for(let i=0;i<nc;i++)candyRect(q.x0+i*(q.cw+8),q.y,q.cw,32,10,PAL[i]);
        lbl(Math.max(0,budget-moves)+' paints left',W/2,b.y+16,14,'#61739A');
      },
      tap(x,y){
        const q=sw();
        for(let i=0;i<nc;i++){
          const px=q.x0+i*(q.cw+8);
          if(x>=px&&x<=px+q.cw&&y>=q.y&&y<=q.y+32){
            if(v[i]===v[0]){buzz();return;}
            const reg=region();
            for(const k of reg)v[k]=i;
            moves++;blip(420+moves*20);
            if(done()){win(moves<=budget*.6?3:moves<=budget*.82?2:1);return;}
            if(moves>=budget)fail('Ran out of paint');
            return;
          }
        }
      },
      hud(){return 'covered '+region().length+'/'+v.length+' · taps '+moves+'/'+budget;},
      summary(){return 'flooded the board in <b>'+moves+'</b> paints';}
    };
  }});
